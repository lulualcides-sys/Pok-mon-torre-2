name: T19 — gym leaders balanced tactics, legal moves and native Phaser
on:
  push:
    branches: [feat/t19-gym-leader-tactics-20261030]
permissions:
  contents: read
jobs:
  gym-challenge:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Focused gym and existing trainer unit regressions
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test tests/gym-leader-challenge.test.js tests/trainer-strategy.test.js tests/trainer-items.test.js
      - name: Full Node tests and approved VFX policy
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run check:reuse
      - name: Build original Phaser/WebGL client
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json; then break; fi
            if [ "$i" -eq 4 ]; then exit 1; fi
            sleep $((i*8))
          done
      - name: Verify native Phaser strategy and legal leader UIs
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/trainer-strategy-browser.cjs
          node tests/t12-trainer-native-ai-after-switch-browser.cjs
          node tests/t26-kanto-leaders-badges-mobile-browser.cjs
          node tests/t19-gym-leader-challenge-browser.cjs
      - name: Full applicable browser regression suite
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Archive native screenshots and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t19-gym-leaders-legal-ai-phaser
          path: |
            test-evidence/
            _site/arena2d/version.json
          retention-days: 14
          if-no-files-found: warn
