name: Master T05 — native CPU KO, status and save reload
on:
  push:
    branches: [test/t05-native-ko-status-reload-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t05-native-ko:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, complete unit suite and preservation gates
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t05-native-ko-reload-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Build actual Phaser/WebGL client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
          node --test tests/t05-event-checkpoints-built.test.mjs tests/t05-duplicate-uid-built.test.mjs tests/t05-partial-storage-reads-built.test.mjs
      - name: Genuine native KO, Chromium reload and browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t05-native-ko-reload-browser.cjs
          npm run test:browser
      - name: Evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t05-native-ko-status-reload
          path: |
            test-evidence/t05-native-ko-*
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
