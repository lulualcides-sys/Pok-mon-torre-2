name: Master T12 — strategic trainer reengages native AI
on:
  push:
    branches: [test/master-t12-trainer-reengage-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trainer-ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, syntax and provenance safeguards
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t12-trainer-native-ai-after-switch-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Build current original Phaser client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*6))
          done
          node tools/pokearena/build-preview.mjs
      - name: Real Chromium strategic swap and native AI continuity
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t12-trainer-native-ai-after-switch-browser.cjs
      - name: Official full Phaser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t12-trainer-native-ai-after-switch
          path: test-evidence/
          if-no-files-found: warn
