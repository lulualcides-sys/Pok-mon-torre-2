name: Pokédex native P2 stage and legal Kanto role regression
on:
  push:
    branches: [fix/pokedex-native-role-distribution-20261029]
  pull_request:
    paths:
      - 'tools/pokearena/torre2-pokedex-pages.mjs'
      - 'tools/pokearena/torre2-move-pool.js'
      - 'tests/pokedex-upstream-layout.test.js'
      - '.github/workflows/pokedex-native-roles-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pokedex:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit tests, syntax, approved renderers
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-pokedex-pages.mjs
          node --check tools/pokearena/torre2-move-pool.js
          node --test tests/pokedex-upstream-layout.test.js tests/pokedex-native-type-fallback.test.js
          npm run check
          npm run check:reuse
          npm test
      - name: Capture and build actual Poké Arena 2D source
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt*8))
          done
          test -s _site/arena2d/version.json
      - name: Native 151 species, Lv5 to Lv50 and evolution regression
        run: |
          set -euo pipefail
          node tools/pokearena/audit-moves.mjs
          node tests/t07-151-movesets-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/t08-arena-role-slots-built.test.mjs
          node tests/t03-evolved-pokedex-built.test.mjs
          node tests/t07-approved-native-overlap-built.test.mjs
      - name: Chromium Pokédex and campaign controls
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/source-client-smoke.cjs
          node tests/t18-pokedex-native-colors-browser.cjs
          node tests/t08-arena-roles-summary-mobile-browser.cjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokedex-native-roles-evidence
          path: test-evidence/
          retention-days: 14
          if-no-files-found: warn
