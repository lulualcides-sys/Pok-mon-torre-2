name: Master T05 — party UID and species integrity
on:
  push:
    branches: [fix/t05-party-identity-guard-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t05-party-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full unit, syntax and approved-asset preservation checks
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-party-battle.js
          node --check tests/t05-legacy-party-uid-built.test.mjs
          npm test
          npm run check
          npm run check:reuse
      - name: Build actual versioned Phaser/WebGL client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
          node --test tests/t05-legacy-party-uid-built.test.mjs tests/t05-duplicate-uid-built.test.mjs tests/t05-event-checkpoints-built.test.mjs
      - name: Official native Phaser Chromium/WebGL regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t05-party-uid-species-integrity
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
