name: Master T25 — mobile PC safe transfers
on:
  push:
    branches: [test/master-t25-mobile-pc-transaction-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t25-mobile-pc:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source, syntax, unit and move policy
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t25-mobile-pc-transfer-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Capture/build native authorized Phaser client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Verify real touchscreen PC transactions and reload
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t25-mobile-pc-transfer-browser.cjs
      - name: Official original Phaser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t25-mobile-pc-transaction-evidence
          path: test-evidence/
          if-no-files-found: warn
