name: Master T04 — safe Phaser recall cleanup
on:
  push:
    branches: [fix/t04-guard-vfx-destroy-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t04-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full unit tests, syntax and reuse policies
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-combat-boundary.js
          node --test tests/combat-boundary.test.js tests/t04-two-transitions.test.js
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and build native Phaser WebGL client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs && test -s _site/arena2d/version.json && test -s _site/arena2d/lib/phaser.min.js; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 6))
          done
      - name: Native T04 browser checks and full Phaser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t04-consecutive-pointer-switches-browser.cjs
          node tests/t04-natural-faint-second-ko-browser.cjs
          npm run test:browser
      - name: Archive native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t04-safe-recall-evidence
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
