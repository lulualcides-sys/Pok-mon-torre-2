name: T07/T08 — earned Lv8 native AUTO default regression
on:
  push:
    branches: [fix/t07-earned-ult-auto-default-20261030]
  pull_request:
    paths:
      - 'tests/t07-earned-level8-three-natural-wins-touch-browser.cjs'
      - 'tests/t07-earned-lv8-training-ult-browser.cjs'
      - '.github/workflows/t07-earned-ult-auto-default-regression.yml'
permissions:
  contents: read
jobs:
  earned-ult-real-phaser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, unit tests and native-policy gates
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t07-earned-level8-three-natural-wins-touch-browser.cjs
          node --check tests/t07-earned-lv8-training-ult-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build approved original Phaser/WebGL client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Verify real built Kanto 151 intro and thematic Lv8 ULT contracts
        run: |
          set -euo pipefail
          node tests/t08-kanto-onboarding-151-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
      - name: Native early trainer wins, earned Lv8, reload, touchscreen E
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          T07_STARTER=bulbasaur node tests/t07-earned-level8-three-natural-wins-touch-browser.cjs
          node tests/t07-earned-lv8-training-ult-browser.cjs
      - name: Existing native browser suite
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Preserve evidence and original build identifier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t07-earned-lv8-auto-default-phaser
          path: |
            test-evidence/
            _site/arena2d/version.json
          retention-days: 7
          if-no-files-found: warn
