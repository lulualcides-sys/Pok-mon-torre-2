name: Pages — native-first VFX real prepublication regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/pokearena/torre2-move-pool.js'
      - 'tools/pokearena/audit-moves.mjs'
      - 'tests/batch24-built.test.mjs'
      - 'tests/t07-approved-native-overlap-built.test.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/pages-native-vfx-preflight.yml'
      - 'tools/pokearena/torre2-pokedex-families.js'
      - 'tools/pokearena/torre2-pokedex-native-reset.mjs'
      - 'tests/pokedex-native-families.test.js'
      - 'tests/pokedex-crossgen-families-built.test.mjs'
      - 'tests/pokedex-crossgen-families-browser.cjs'
permissions:
  contents: read
  actions: read
jobs:
  pages-native-vfx-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source dependency and complete original Phaser build (no placeholder sprites)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          bash tools/pokearena/capture-resilient.sh
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/index.html
          test -s _site/arena2d/lib/phaser.min.js
      - name: Run every predeploy move and gameplay gate also used by Pages
        shell: bash
        run: |
          set -euo pipefail
          node tools/pokearena/audit-moves.mjs
          node tests/t07-approved-native-overlap-built.test.mjs
          node tests/versus-intro-built.test.mjs
          node tests/center-revive-built.test.mjs
          node tests/batch24-built.test.mjs
          node tests/misty-surge-built.test.mjs
          node tests/misty-wild-capture-ui-built.test.mjs
          node tests/rival-payday-cooldowns-built.test.mjs
          node tests/surge-shop-rematch-allmaps-built.test.mjs
          node tests/surge3-built.test.mjs
          node tests/rematches-built.test.mjs
          node tests/t23-kanto-mart-tm-integrity-built.test.mjs
          node tests/kanto-151-built.test.mjs
          node tests/frlg-learnsets-built.test.mjs
          node tests/t07-frlg-natural-catalog-built.test.mjs
          node tests/t08-kanto-no-duplicate-native-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
          node tests/t08-kanto-onboarding-151-built.test.mjs
          node tests/mew-lv50-natural-pokedex-built.test.mjs
          node tests/noncombat-pixel-buttons-built.test.mjs
          node tests/t07-frlg-unrendered-136x639-built.test.mjs
          node tests/t08-arena-role-slots-built.test.mjs
          node tests/t08-leech-seed-campaign-balance-built.test.mjs
          node tests/finale13-built.test.mjs
          node tests/rayquaza-mega-built.test.mjs
          node --test tests/pokedex-native-families.test.js
          node tests/pokedex-crossgen-families-built.test.mjs
      - name: Real original Chromium smoke and mobile Pokemon selection
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/source-client-smoke.cjs
          node tests/selection-original-mobile-browser.cjs
          node tests/pokedex-crossgen-families-browser.cjs
      - name: Preserve browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-native-vfx-preflight-evidence
          path: test-evidence/
          if-no-files-found: warn
