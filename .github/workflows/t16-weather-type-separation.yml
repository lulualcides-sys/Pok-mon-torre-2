name: T16 — Rain Dance somente Água e Thunder elétrico separado
on:
  push:
    branches: [fix/t16-weather-type-role-rain-water-only-20261031]
  pull_request:
    paths:
      - 'tools/pokearena/torre2-move-pool.js'
      - 'tools/pokearena/torre2-weather.js'
      - 'tests/weather.test.js'
      - 'tests/t16-rain-40-equipment-built.test.mjs'
      - 'tests/t17-weather-status-float.test.js'
      - '.github/workflows/t16-weather-type-separation.yml'
permissions:
  contents: read
jobs:
  climate-roles:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify water-only rain, neutral electric, hail and unchanged status visuals
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test tests/weather.test.js tests/t17-weather-status-float.test.js
          npm test
          npm run check
          npm run check:reuse
      - name: Compile official original Phaser and weather move editor
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs &&
              test -s _site/arena2d/version.json && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Validate all 31 Water species, 9 barred Electric and old saves
        run: |
          set -euo pipefail
          node tests/t16-rain-40-equipment-built.test.mjs
          node tests/t16-weather-equipment-built.test.mjs
          node tests/t08-arena-role-slots-built.test.mjs
      - name: Native Phaser AUTO casts Water Rain Dance without breaking Thunder and weather HUD
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t16-auto-weather-native-browser.cjs
          CHROME_BIN="$(command -v google-chrome)" node tests/t17-weather-status-mobile-browser.cjs
      - name: Full browser regressions of combat and approved VFX
        run: CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t16-water-only-rain-electric-thunder
          path: |
            test-evidence/t16-auto-weather-native.png
            test-evidence/t16-auto-weather-native.json
            test-evidence/t17-weather-status-mobile.png
          if-no-files-found: warn
