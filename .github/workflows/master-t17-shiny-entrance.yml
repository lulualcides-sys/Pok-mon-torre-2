name: Master T17 — native Shiny entrance 1.5s
on:
  push:
    branches: [feat/t17-shiny-battle-stars-native-20261031]
  pull_request:
    paths:
      - 'tools/pokearena/torre2-shiny-fx.js'
      - 'tools/pokearena/torre2-party-battle.js'
      - 'tools/pokearena/build-preview.mjs'
      - 'tests/t17-shiny-entrance*'
      - '.github/workflows/master-t17-shiny-entrance.yml'
      - 'specs/019-shiny-entrance/**'
permissions:
  contents: read
jobs:
  shiny-entrance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source safety and original move reuse
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test tests/t17-shiny-entrance.test.js
          npm test
          npm run check
          npm run check:reuse
      - name: Compile original authorized Phaser/WebGL
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs && test -s _site/arena2d/version.json; then break; fi
            if [ "$i" -eq 4 ]; then exit 1; fi
            sleep $((8*i))
          done
      - name: Genuine compiled Phaser mobile battle, visible star lifetime
        run: CHROME_BIN="$(command -v google-chrome)" node tests/t17-shiny-entrance-mobile-browser.cjs
      - name: Original browser regression
        run: CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t17-shiny-stars-native-mobile
          path: test-evidence/t17-shiny-entrance-mobile.png
          if-no-files-found: warn
