name: T34 — gym ace native WebGL desktop/mobile
on:
  push:
    branches: [feat/t34-gym-ace-browser-gates-20261031]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t34-gym-ace-browser-gates
  cancel-in-progress: true
jobs:
  gym-ace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Node and source regressions
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run check
          npm run check:reuse
          node --check tests/gym-ace-browser.cjs
      - name: Build original Phaser client
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if node tools/pokearena/capture-client.mjs &&
               node tools/pokearena/build-preview.mjs &&
               test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$i" = 3 ]; then exit 1; fi
            sleep "$((i*8))"
          done
      - name: Brock Onix and Misty Starmie real WebGL screenshots
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/gym-ace-browser.cjs
      - name: Existing Cerulean navigation regression
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/city-hub-browser.cjs
      - name: Preserve screenshots and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t34-gym-ace-real-webgl
          path: |
            test-evidence/gym-ace-*
            test-evidence/city-layered-*
          retention-days: 21
          if-no-files-found: warn
