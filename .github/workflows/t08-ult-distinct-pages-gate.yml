name: T08 — fix Pages gate for real weak ULT names
on:
  push:
    branches: [fix/t08-ult-distinct-native-names-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t08-pages-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, syntax and approved four-source VFX gate
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run check:reuse
          node --check tools/pokearena/torre2-move-pool.js
          node --check tests/t08-ult-distinct-names-built.test.mjs
          npm test
      - name: Capture and build versioned Phaser WebGL
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$n" = 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Re-run exact failed Pages gate plus 151 x 227 and native ULT
        run: |
          set -euo pipefail
          node tools/pokearena/audit-moves.mjs
          node tests/kanto-151-built.test.mjs
          node tests/frlg-learnsets-built.test.mjs
          node tests/misty-surge-built.test.mjs
          node tests/t07-frlg-natural-catalog-built.test.mjs
          node tests/t08-ult-distinct-names-built.test.mjs
          node tests/t08-summary-real-moves-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/t05-summary-equip-atomic-built.test.mjs
      - name: Native mobile Phaser and full browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t08-summary-mobile-choice-browser.cjs
          node tests/kanto-intro-touch-browser.cjs
          npm run test:browser
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t08-ult-names-pages-regression
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14
