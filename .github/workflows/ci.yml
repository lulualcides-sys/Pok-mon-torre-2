name: Pokémon Torre 2 — Testes de Combate e WebGL

on:
  push:
    branches: [main, visual-overhaul-pokearena-v02, v03-battle-fidelity, v04-pokearena-battle-depth, v05-mobile-battle-camera, v07-mobile-analog-joystick, v08-arena-combat-lab]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar dependencias de navegador
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --version
          google-chrome --version
      - name: Verificar sintaxe do jogo e regras da campanha
        run: |
          set -euo pipefail
          npm run check
          npm run check:reuse
          for source in tools/pokearena/torre2-*.js; do
            node --check "$source"
          done
          npm test
      - name: Iniciar versão real de teste
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > test-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsSI http://127.0.0.1:4173/src/combat-core.js
      # The PixiJS laboratory is an older, unrelated renderer kept as
      # regression evidence. Its moving-opponent impact timing can be flaky
      # under shared SwiftShader runners; never prevent publishing the new
      # Phaser Kanto game because the old laboratory missed a target.
      # The GitHub Pages deploy STILL gates on a full Phaser battle smoke.
      - name: Testar laboratorio legado PixiJS (diagnostico nao bloqueante)
        # The legacy PixiJS laboratory is not the Phaser Kanto runtime.
        # Keep it available on manual CI, not as a 2-minute delay for every
        # emergency fix. Pages always executes full Chromium Phaser smoke.
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - name: Preservar capturas e erros mesmo na falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-torre-2-primeira-batalha-evidencias
          path: |
            test-evidence/
            test-http.log
          if-no-files-found: warn
          retention-days: 30
