name: Master T10 — native mobile AUTO toggle
on:
  push:
    branches: [test/master-t10-native-mobile-auto-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source and unit regression
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t10-native-mobile-auto-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Build real Phaser client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*6))
          done
          node tools/pokearena/build-preview.mjs
      - name: Test native AUTO mobile touch in Arena and campaign
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t10-native-mobile-auto-browser.cjs
      - name: Complete official Phaser browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t10-native-mobile-auto-evidence
          path: test-evidence/
          if-no-files-found: warn
