name: Arena — espécies, cooldowns e evolução Eevee (isolado)

on:
  push:
    branches: [fix/arena-moves-eevee-cooldown-20261026, fix/arena-cooldowns-4-6s-20261026, fix/arena-cooldowns-2-4s-egg-bomb-20261026, fix/arena-thunder-cooldown-3s-20261026, fix/arena-fireblast-charge-shield-size-20261026]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Checar codigo e regressões unitarias
        run: |
          set -euo pipefail
          node --check tools/pokearena/torre2-arena-move-policy.js
          node --check tools/pokearena/build-preview.mjs
          node --test tests/arena-species-kit-policy.test.js
          npm run check
          npm test
      - name: Capturar fonte aprovada e construir versao isolada
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep 4
          done
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
          node tools/pokearena/audit-arena-guards.mjs
      - name: Testar evolução e golpes fora da campanha em Chromium
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/finale13-built.test.mjs
          node tests/arena-species-kit-browser.cjs
          node tests/evolution-modes-built.test.mjs
          node tests/arena-evolved-selection-browser.cjs
          node tests/arena-base-form-touch-browser.cjs
      - name: Preservar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-kanto-moves-evolution-evidencias
          path: |
            test-evidence/
            site-capture/CAPTURE-REPORT.json
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 7
