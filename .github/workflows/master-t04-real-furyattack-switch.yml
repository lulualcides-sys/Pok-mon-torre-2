name: Master T04 — native Fury Attack real switch
on:
  push:
    branches: [test/t04-native-furyattack-switch-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-furyattack-switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, preservation and unit gates
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t04-real-furyattack-switch-browser.cjs
          node --test tests/t04-two-transitions.test.js
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and build real Phaser/WebGL client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
          node --test tests/t04-native-doublekick-boundary-built.test.mjs
      - name: Real Chromium hit-switch and full browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t04-real-furyattack-switch-browser.cjs
          npm run test:browser
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t04-real-furyattack-switch
          path: |
            test-evidence/t04-real-furyattack-switch.*
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
