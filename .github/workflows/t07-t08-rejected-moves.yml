name: T07/T08 — deferred Scratch and rejected Surf gates
on:
  push:
    branches: [main, fix/t07-t08-pages-surf-policy-regression-20261029]
    paths:
      - 'tools/pokearena/torre2-kanto-intro-moves.js'
      - 'tools/pokearena/torre2-move-pool.js'
      - 'tests/kanto-intro-moves.test.js'
      - 'tests/t08-151-signature-ult-built.test.mjs'
      - 'tests/finale13-built.test.mjs'
      - '.github/workflows/t07-t08-rejected-moves.yml'
  pull_request:
    paths:
      - 'tools/pokearena/torre2-kanto-intro-moves.js'
      - 'tools/pokearena/torre2-move-pool.js'
      - 'tests/kanto-intro-moves.test.js'
      - 'tests/t08-151-signature-ult-built.test.mjs'
      - 'tests/finale13-built.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign-move-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, syntax and approved VFX integrity
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-kanto-intro-moves.js
          node --check tools/pokearena/torre2-move-pool.js
          node --check tests/t08-151-signature-ult-built.test.mjs
          npm run check
          npm run check:reuse
          npm test
      - name: Compile real Phaser/WebGL client
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
                && node tools/pokearena/build-preview.mjs \
                && test -s _site/arena2d/version.json \
                && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Validate 151 species, legal level-up and rejected effects
        shell: bash
        run: |
          set -euo pipefail
          node tools/pokearena/audit-moves.mjs
          node tests/batch24-built.test.mjs
          node tests/misty-surge-built.test.mjs
          node tests/surge3-built.test.mjs
          node tests/kanto-151-built.test.mjs
          node tests/frlg-learnsets-built.test.mjs
          node tests/t07-frlg-natural-catalog-built.test.mjs
          node tests/t08-kanto-no-duplicate-native-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
          node tests/t07-frlg-unrendered-136x639-built.test.mjs
          node tests/t08-arena-role-slots-built.test.mjs
          node tests/t08-leech-seed-campaign-balance-built.test.mjs
          node tests/finale13-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
      - name: Native Chromium touch and full browser regression
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/batch24-browser.cjs
          node tests/source-client-smoke.cjs
          node tests/t08-arena-roles-summary-mobile-browser.cjs
          npm run test:browser
      - name: Preserve actual evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t07-t08-deferred-scratch-rejected-surf-evidence
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 21
