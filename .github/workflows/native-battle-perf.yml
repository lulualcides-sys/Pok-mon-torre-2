name: Native Phaser battle entry and frame-time audit
on:
  push:
    branches: [perf/native-battle-entry-mobile-20261102]
    paths:
      - 'tests/native-battle-perf-browser.cjs'
      - 'tools/pokearena/torre2-campaign-scene.js'
      - 'tools/pokearena/build-preview.mjs'
      - '.github/workflows/native-battle-perf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-battle-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Browser dependencies and syntax
        run: |
          npm install --no-audit --no-fund
          node --check tests/native-battle-perf-browser.cjs
          node --check tools/pokearena/torre2-campaign-scene.js
      - name: Capture native assets and assemble Phaser WebGL
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Real trainer entry and frame-time in Chromium desktop and touch emulation
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/native-battle-perf-browser.cjs
      - name: Preserve screenshots and truthful numeric metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-phaser-battle-performance-evidence
          path: test-evidence/native-battle-*
          retention-days: 14
          if-no-files-found: warn
