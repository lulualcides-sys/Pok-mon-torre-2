name: PB Ranked — mecânicas de golpes via AST

on:
  push:
    branches: [research/pb-ranked-rea-20261031]
    paths:
      - 'tools/research/pb-ranked-move-mechanics.cjs'
      - '.github/workflows/pb-ranked-move-mechanics.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pb-ranked-move-mechanics
  cancel-in-progress: false

jobs:
  index-public-move-ast:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check code and install AST parser
        run: |
          set -euo pipefail
          node --check tools/research/pb-ranked-move-mechanics.cjs
          npm install --no-save --no-audit --no-fund acorn acorn-walk
      - name: Analyze publicly delivered game moves
        run: |
          set -euo pipefail
          node tools/research/pb-ranked-move-mechanics.cjs
          node - <<'NODE'
          const a=require('./reference-library/pb-ranked/golpes-mecanicas-ast.json');
          if(a.unique<100)throw Error('Insufficient catalog coverage');
          if(a.moves.some(m=>!m.variants||!m.variants.length))throw Error('Malformed records');
          console.log('Verified',a.unique,'distinct move names',a.records,'variants');
          NODE
      - name: Commit ONLY derived move metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference-library/pb-ranked/golpes-mecanicas-ast.json reference-library/pb-ranked/golpes-mecanicas-resumo.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: index detailed public move metadata without copying source or artwork'
            git pull --rebase origin research/pb-ranked-rea-20261031
            git push origin HEAD:research/pb-ranked-rea-20261031
          fi
