name: Master T05 — checkpoints de save em eventos e Chromium
on:
  push:
    branches: [test/master-t05-event-persistence-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, original rules and unit regression
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t05-event-checkpoints-built.test.mjs
          node --check tests/t05-event-persistence-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build original versioned Phaser/WebGL client
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: T05 real event save and backup regression
        run: |
          set -euo pipefail
          node --test tests/t05-event-checkpoints-built.test.mjs
          node --test tests/t05-campaign-backup-built.test.mjs
      - name: Chromium Phaser reload after capture and battle
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t05-event-persistence-browser.cjs
          node tests/t05-browser-reload.cjs
          npm run test:browser
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-t05-event-persistence
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
