name: T07 — preserve approved VFX across upstream name overlaps
on:
  push:
    branches: [fix/t07-preserve-approved-vfx-native-overlap-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-vfx:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, user VFX integrity, all unit tests
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-move-pool.js
          node --check tools/pokearena/audit-moves.mjs
          node --check tests/t07-approved-native-overlap-built.test.mjs
          npm run check
          npm run check:reuse
          npm test
      - name: Capture current native client, compile once
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt*8))
          done
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Strict no-duplicate audit and Kanto 151 regression
        run: |
          set -euo pipefail
          node tools/pokearena/audit-moves.mjs
          node tests/t07-approved-native-overlap-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
          node tests/t08-kanto-dex-live-levels-built.test.mjs
          node tests/t08-ult-saved-versus-battle-built.test.mjs
          node tests/t08-summary-upcoming-151-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
      - name: Native Phaser browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t08-arena-roles-summary-mobile-browser.cjs
          npm run test:browser
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t07-approved-native-overlap-evidence
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14
