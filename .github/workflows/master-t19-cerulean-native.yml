name: Master T19 — two real Cerulean trainer fights
on:
  push:
    branches: [test/master-t19-native-cerulean-two-fights-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t19-cerulean:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, unit and approved-move integrity
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t19-two-native-cerulean-trainers-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and build original authorized Phaser client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Win two consecutive live Cerulean battles without forced results
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t19-two-native-cerulean-trainers-browser.cjs
      - name: Complete official Phaser browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t19-cerulean-native-victory-proof
          path: test-evidence/
          if-no-files-found: warn
