name: Master Pages — Phaser critical source retry validation
on:
  push:
    branches: [fix/pages-retry-critical-phaser-assets-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source, game, VFX and workflow retry semantics
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          npm run check
          npm run check:reuse
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/pages.yml').read_text()
          expected=['node tools/pokearena/capture-client.mjs','node tools/pokearena/build-preview.mjs','test -s _site/arena2d/index.html','test -s _site/arena2d/lib/phaser.min.js']
          section=source.split('name: Adicionar cliente Phaser autorizado do Poké Arena como arena isolada')[1].split('name: Bloquear golpes duplicados')[0]
          check=section[section.index('for attempt in 1 2 3 4; do'):section.index('          done')+len('          done')]
          assert all(x in check for x in expected)
          assert '&& node tools/pokearena/build-preview.mjs' in check
          assert '&& test -s _site/arena2d/lib/phaser.min.js' in check
          print('PASS: critical Phaser asset check is inside bounded retry loop')
          PY
      - name: Capture build and verify critical Phaser runtime
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
                && node tools/pokearena/build-preview.mjs \
                && test -s _site/arena2d/index.html \
                && test -s _site/arena2d/lib/phaser.min.js; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Test Chromium original Phaser and full browser suite
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/source-client-smoke.cjs
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - name: Archive evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-critical-phaser-retry
          path: test-evidence/
          if-no-files-found: warn
