name: T07/T08 — 151 authentic signature ULTs and learned moves
on:
  push:
    branches: [fix/t07-t08-151-signature-ults-legal-moves-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kanto-moves:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, all unit tests, VFX and licensing integrity
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run check:reuse
          node --check tools/pokearena/kanto-ultimate-policy.js
          node --check tools/pokearena/torre2-kanto-intro-moves.js
          node --check tools/pokearena/torre2-move-pool.js
          node --check tests/t08-151-signature-ult-built.test.mjs
          npm test
      - name: Compile original versioned Phaser/WebGL client
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
                && node tools/pokearena/build-preview.mjs \
                && test -s _site/arena2d/lib/phaser.min.js \
                && test -s _site/arena2d/version.json; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Validate 151 Kanto species × 227 installed moves and level gates
        shell: bash
        run: |
          set -euo pipefail
          node tools/pokearena/audit-moves.mjs
          node tests/frlg-learnsets-built.test.mjs
          node tests/t07-151-movesets-built.test.mjs
          node tests/t07-invalid-tm-save-151x227-built.test.mjs
          node tests/t07-gen45-kanto-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/t08-kanto-ult-level-transition-built.test.mjs
          node tests/t08-kanto-no-duplicate-native-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
          node tests/t08-summary-real-moves-built.test.mjs
          node tests/t08-ult-distinct-names-built.test.mjs
      - name: Mobile summary, original battle and full Chromium regression
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/kanto-intro-touch-browser.cjs
          node tests/t08-summary-mobile-choice-browser.cjs
          npm run test:browser
      - name: Preserve full Kanto coverage and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t08-151-signature-ults-and-legal-moves-evidence
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 30
