name: T08 — Leech Seed healing balance in campaign
on:
  push:
    branches: [fix/t08-campaign-leech-seed-lifesteal-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  leech-seed-balance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify syntax, full unit suite and approved renderer integrity
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-move-pool.js
          node --check tests/t08-leech-seed-campaign-balance-built.test.mjs
          npm run check
          npm run check:reuse
          npm test
      - name: Capture original Phaser client and compile the Kanto campaign
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
                && node tools/pokearena/build-preview.mjs \
                && test -s _site/arena2d/version.json \
                && test -s _site/arena2d/lib/phaser.min.js; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Assert Leech Seed healing only in campaign and verify 151 move roles
        shell: bash
        run: |
          set -euo pipefail
          node tests/t08-leech-seed-campaign-balance-built.test.mjs
          node tests/t08-kanto-no-duplicate-native-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
          node tests/misty-surge-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
      - name: Test battle, move selection, and campaign on real Chromium
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/kanto-intro-touch-browser.cjs
          node tests/t08-summary-mobile-choice-browser.cjs
          npm run test:browser
      - name: Save any test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t08-leech-seed-campaign-balance-evidence
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14
