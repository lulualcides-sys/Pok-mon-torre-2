name: Master T05 — atomic battle results and mobile retry
on:
  push:
    branches: [fix/t05-battle-results-atomic-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-results:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, unit tests and four-source reuse policy
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-campaign-core.js
          node --check tools/pokearena/torre2-campaign-scene.js
          node --check tests/t05-battle-results-atomic-built.test.mjs
          node --check tests/t05-battle-result-denied-ui-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build original Phaser/WebGL client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Atomic trainer, gym, League, wild and rematch results
        run: |
          set -euo pipefail
          node --test tests/t05-battle-results-atomic-built.test.mjs
          node --test tests/t05-event-checkpoints-built.test.mjs
          node --test tests/t05-backup-rollback-on-denial-built.test.mjs
          node tests/campaign-awards-built.test.mjs
      - name: Native Phaser mobile retry and full Chromium regressions
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t05-battle-result-denied-ui-browser.cjs
          node tests/t05-event-persistence-browser.cjs
          node tests/rematches-browser.cjs
          npm run test:browser
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t05-battle-results-atomic
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
