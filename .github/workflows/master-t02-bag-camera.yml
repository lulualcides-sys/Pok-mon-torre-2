name: T02 — Bolsa fixa com câmera deslocada
on:
  push:
    branches: [fix/master-t02-bag-camera-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  battle-bag-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies and check approved moves
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-battle-bag.js
          node --check tests/t02-bag-camera-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build native Phaser/WebGL
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Battle Bag camera and touch regressions
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t02-bag-camera-browser.cjs
          node tests/battle-bag-browser.cjs
          node tests/t02-desktop-run-browser.cjs
      - name: Complete official battle browser suite
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t02-bag-camera-evidence
          path: |
            test-evidence/t02-bag-camera-*
            test-evidence/battle-bag-*
            test-evidence/t02-desktop-*
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
