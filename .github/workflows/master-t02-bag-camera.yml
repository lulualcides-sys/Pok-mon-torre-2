name: T02 — Bolsa fixa na camera Phaser
on:
  push:
    branches: [fix/master-t02-bag-hud-camera-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bag:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source and unit suite
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-battle-bag.js
          node --check tests/t02-bag-camera-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build native Phaser
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Test camera offset, potion and antidote; old mobile regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t02-bag-camera-browser.cjs
          node tests/battle-bag-browser.cjs
          node tests/t02-mobile-menu-browser.cjs
      - name: Official Phaser browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t02-bag-camera-anchored
          path: |
            test-evidence/t02-bag-camera-*
            test-evidence/battle-bag-*
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
