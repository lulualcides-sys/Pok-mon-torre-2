name: Arena 121 — golpes aprovados e esquivas nativas do Poké Arena
on:
  push:
    branches: [feat/arena-121-curated-moves-native-dodge-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arena-121:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar ferramentas e verificar sintaxe
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-arena-approved-121.js
          node --check tools/pokearena/torre2-arena-native-dodges.js
          node --check tools/pokearena/torre2-arena-move-policy.js
          node --check tools/pokearena/build-preview.mjs
          node --check tests/arena-121-native-dodge-built.test.mjs
          npm test
      - name: Capturar e compilar o cliente Phaser com os 121 kits
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs &&
               node tools/pokearena/build-preview.mjs &&
               test -s _site/arena2d/version.json; then
              break
            fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep $((attempt*7))
          done
      - name: Auditar 121 espécies e habilidades de ESQUIVA reais
        run: |
          set -euo pipefail
          node tests/arena-121-native-dodge-built.test.mjs
          node tests/batch24-built.test.mjs
          node tests/t08-arena-role-slots-built.test.mjs
      - name: Testar o combate real no navegador
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          node tests/arena-species-kit-browser.cjs
          node tests/arena-base-form-touch-browser.cjs
          node tests/arena-121-native-esp-touch-browser.cjs
      - name: Guardar relatório da auditoria e provas de combate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-121-native-move-evasion
          path: test-evidence/
          retention-days: 21
          if-no-files-found: warn
