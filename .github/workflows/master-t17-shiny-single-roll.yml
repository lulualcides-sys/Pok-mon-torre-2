name: Master T17 — 1pct wild Shiny and atomic lineage
on:
  push:
    branches: [fix/t17-shiny-single-roll-persistent-20261031]
  pull_request:
    paths:
      - 'tools/pokearena/torre2-campaign-core.js'
      - 'tests/t17-shiny-single-roll-built.test.mjs'
      - '.github/workflows/master-t17-shiny-single-roll.yml'
      - 'specs/017-shiny-single-roll/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t17-shiny-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source, safety and compatibility tests
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-campaign-core.js
          node --check tests/t17-shiny-single-roll-built.test.mjs
          npm test
          npm run check
          npm run check:reuse
      - name: Restaurar release auditada com PMD completo e validar SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/pokearena/prepare-audited-qa.sh
          done
      - name: Compiled saved Shiny, PC, evolution and denied write
        run: |
          node --test tests/t17-shiny-single-roll-built.test.mjs
      - name: Browser regressions for the approved native 0.71.3 client
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/alpha0713-hotfix-navigation-browser.cjs
          node tests/arena-johto-evolutions-browser.cjs
          node tests/arena-species-kit-browser.cjs
