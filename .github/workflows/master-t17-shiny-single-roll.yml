name: Master T17 — 1pct wild Shiny and atomic lineage
on:
  push:
    branches: [fix/t17-shiny-single-roll-persistent-20261031]
  pull_request:
    paths:
      - 'tools/pokearena/torre2-campaign-core.js'
      - 'tests/t17-shiny-single-roll-built.test.mjs'
      - '.github/workflows/master-t17-shiny-single-roll.yml'
      - 'specs/017-shiny-single-roll/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t17-shiny-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source, safety and compatibility tests
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-campaign-core.js
          node --check tests/t17-shiny-single-roll-built.test.mjs
          npm test
          npm run check
          npm run check:reuse
      - name: Build original Phaser client
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs && test -s _site/arena2d/version.json; then break; fi
            if [ "$i" -eq 4 ]; then exit 1; fi
            sleep $((i*8))
          done
      - name: Compiled saved Shiny, PC, evolution and denied write
        run: |
          node --test tests/t17-shiny-single-roll-built.test.mjs
      - name: Original Phaser browser regression
        run: |
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
