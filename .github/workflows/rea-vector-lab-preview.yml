name: REA vectors — isolated battle laboratory visual proof
on:
  push:
    branches: [feat/rea-vector-lab-preview-20261101]
    paths:
      - 'tools/pokearena/torre2-rea-vector-math.js'
      - 'tools/pokearena/torre2-rea-vector-preview.js'
      - 'tools/pokearena/torre2-laboratory.js'
      - 'tools/pokearena/build-preview.mjs'
      - 'tests/rea-vector-preview.test.js'
      - 'tests/rea-vector-browser.cjs'
      - '.github/workflows/rea-vector-lab-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  math-and-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Syntax and focused kinematics & lab safeguards
        run: |
          set -euo pipefail
          node --check tools/pokearena/torre2-rea-vector-math.js
          node --check tools/pokearena/torre2-rea-vector-preview.js
          node --check tools/pokearena/torre2-laboratory.js
          node --check tools/pokearena/build-preview.mjs
          node --test tests/rea-vector-preview.test.js
  phaser-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    needs: math-and-isolation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install browser-test dependencies
        run: npm install --no-audit --no-fund
      - name: Capture approved game client and build versioned sandbox
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep "$((attempt*5))"
          done
          test -s _site/arena2d/version.json
          find _site/arena2d -path '*/torre2/rea-vector-preview.js' -type f | grep .
          find _site/arena2d -path '*/torre2/rea-vector-math.js' -type f | grep .
      - name: Screenshot live Phaser visual lab and verify preserved save
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/rea-vector-browser.cjs
      - name: Preserve real screenshot and collision metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-vector-lab-real-browser-evidence
          path: test-evidence/rea-vetor-laboratorio-*
          if-no-files-found: warn
          retention-days: 14
