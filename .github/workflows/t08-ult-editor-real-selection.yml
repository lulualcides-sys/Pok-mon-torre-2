name: T08 — ULT tematica e editor igual ao combate
on:
  push:
    branches: [fix/t08-ult-editor-real-selection-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ultimate-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, unit and VFX integrity
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-move-pool.js
          node --check tools/pokearena/torre2-kanto-intro-moves.js
          node --check tools/pokearena/torre2-campaign-scene.js
          node --check tests/t08-ult-saved-versus-battle-built.test.mjs
          npm run check
          npm run check:reuse
          npm test
      - name: Capture and build native Phaser client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
               && node tools/pokearena/build-preview.mjs \
               && test -s _site/arena2d/version.json; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt*8))
          done
      - name: Compiled 151 Kanto ultimate, roles and save regression
        run: |
          set -euo pipefail
          node tests/t08-ult-saved-versus-battle-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
          node tests/t08-editor-slot-suggestion-built.test.mjs
          node tests/t08-arena-role-slots-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/t08-kanto-ult-level-transition-built.test.mjs
          node tests/t08-kanto-onboarding-151-built.test.mjs
          node tests/t08-ult-distinct-names-built.test.mjs
      - name: Native mobile Chromium fullscreen, tap and complete browser suite
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t08-arena-roles-summary-mobile-browser.cjs
          npm run test:browser
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t08-ult-editor-selection-evidence
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14
