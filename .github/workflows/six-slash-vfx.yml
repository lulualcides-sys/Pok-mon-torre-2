name: Six Slash VFX — sprite integrity

on:
  push:
    branches:
      - feat/six-slash-vfx-review-20261107
    paths:
      - 'reference-assets/vfx/six-slashes/**'
      - 'tools/pokearena/torre2-six-slash-vfx.js'
      - 'tests/six-slash-vfx.test.js'
      - '.github/workflows/six-slash-vfx.yml'
  pull_request:
    paths:
      - 'reference-assets/vfx/six-slashes/**'
      - 'tools/pokearena/torre2-six-slash-vfx.js'
      - 'tests/six-slash-vfx.test.js'
      - '.github/workflows/six-slash-vfx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pixel-sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Phaser adapter
        run: node --check tools/pokearena/torre2-six-slash-vfx.js
      - name: Test six 12-frame transparent animated PNGs and opt-in adapter
        run: node --test tests/six-slash-vfx.test.js
