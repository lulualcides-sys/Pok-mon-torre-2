name: Master T11 — native Gen III damage immunity
on:
  push:
    branches: [test/master-t11-native-gen3-immunities-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-immunities:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, syntax, move-preservation checks
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t11-native-gen3-immunities-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Build authorized native Phaser client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*6))
          done
          node tools/pokearena/build-preview.mjs
      - name: Test seven immunity pairs with native Phaser damage receiver
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t11-native-gen3-immunities-browser.cjs
      - name: Official complete browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t11-gen3-native-immunity-evidence
          path: test-evidence/
          if-no-files-found: warn
