name: PB Ranked — audit public gameplay catalogs without copying assets

on:
  push:
    branches: [research/pb-ranked-175-pendentes-20261101]
    paths:
      - 'tools/research/pb-ranked-public-drift.cjs'
      - 'tests/pb-ranked-public-drift.test.cjs'
      - 'tests/pb-ranked-public-contracts.test.cjs'
      - 'reference-library/pb-ranked/CONTRATOS-PUBLICOS-COMBATE-2026-11-01.json'
      - '.github/workflows/pb-ranked-public-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and isolated drift tests
        run: |
          node --check tools/research/pb-ranked-public-drift.cjs
          node --check tests/pb-ranked-public-drift.test.cjs
          node --test tests/pb-ranked-public-drift.test.cjs tests/pb-ranked-public-contracts.test.cjs
      - name: Read current public metadata and compare to research snapshot
        run: node tools/research/pb-ranked-public-drift.cjs
      - name: Preserve only the derived comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb-ranked-public-drift-report
          path: test-evidence/pb-ranked-public-drift.json
          if-no-files-found: warn
          retention-days: 7
