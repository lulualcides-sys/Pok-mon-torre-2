name: Pokémon Torre 2 — Centro Pokébolas originais

on:
  pull_request:
    paths:
      - 'tools/pokearena/torre2-campaign-scene.js'
      - 'tests/center-revive-browser.cjs'
      - 'tests/center-heal-approved-sprite.test.js'
      - '.github/workflows/center-heal-sprites.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  center:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sintaxe, sprite e regressões
        run: |
          set -euo pipefail
          node --check tools/pokearena/torre2-campaign-scene.js
          node --check tests/center-revive-browser.cjs
          npm install --no-audit --no-fund
          node --test tests/center-heal-approved-sprite.test.js
          npm test
      - name: Construir cliente Phaser real
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 6))
          done
          node tests/center-revive-built.test.mjs
      - name: Diagnosticar preload opcional nativo quando o build falhar
        if: failure()
        run: |
          node --input-type=commonjs <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const root='_site/arena2d';
          if(!fs.existsSync(root)){console.log('Native client was not copied');process.exit(0)}
          for(const dir of fs.readdirSync(root).filter(n=>n.startsWith('src-'))){
           const f=path.join(root,dir,'escenas/carga.js');
           if(!fs.existsSync(f))continue;
           const s=fs.readFileSync(f,'utf8');
           const hits=[...s.matchAll(/ui-balls|balls20\\.png/g)];
           console.log('NATIVE_PRELOAD_DIAGNOSTIC',JSON.stringify({
            dir,sha256:crypto.createHash('sha256').update(s).digest('hex'),
            occurrences:hits.length,contexts:hits.slice(0,8).map(m=>s.slice(Math.max(0,m.index-100),m.index+160))
           }));
          }
          NODE
      - name: Validar Centro visual, pulso e cura desktop/mobile no Chromium
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/center-revive-browser.cjs
      - name: Capturas reais e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-torre-2-center-approved-ball
          path: test-evidence/center-heal-*.png
          if-no-files-found: warn
          retention-days: 14
