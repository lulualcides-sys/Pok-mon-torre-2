name: T19 — Existing gym intermediates without new battles (DRAFT)
on:
  push:
    branches: [feat/t19-gym-intermediates-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gym-intermediates:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Focused tests and full regressions
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-gym-intermediates.js
          node --check tools/pokearena/torre2-campaign-scene.js
          node --check tests/gym-intermediates-browser.cjs
          node --test tests/gym-intermediates.test.js
          npm test
          npm run check
          npm run check:reuse
      - name: Build real original Phaser client
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep "$((i*8))"
          done
          source_dir=$(find _site/arena2d -maxdepth 1 -type d -name 'src-*' | head -1)
          test -n "$source_dir"
          test -f "$source_dir/torre2/gym-intermediates.js"
      - name: REAL Phaser/WebGL desktop and mobile — Brock and Misty
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/gym-intermediates-browser.cjs
      - name: Upload real screenshots or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t19-gym-intermediates-real-phaser-desktop-mobile
          path: test-evidence/gym-intermediates/
          retention-days: 21
          if-no-files-found: warn
