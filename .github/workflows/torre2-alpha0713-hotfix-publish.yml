name: Torre 2 — Alpha 0.71.3 hotfix auditado

on:
  pull_request:
    paths:
      - 'tools/pokearena/publish-hotfix-on-alpha0713.mjs'
      - '.github/workflows/torre2-alpha0713-hotfix-publish.yml'
      - 'tests/alpha0713-hotfix-navigation-browser.cjs'
      - 'tools/pokearena/torre2-arena-move-policy.js'
      - 'tests/arena-species-kit-policy.test.js'
  push:
    branches: [main]
    paths:
      - 'tools/pokearena/publish-hotfix-on-alpha0713.mjs'
      - '.github/workflows/torre2-alpha0713-hotfix-publish.yml'
      - 'tests/alpha0713-hotfix-navigation-browser.cjs'
      - 'tools/pokearena/torre2-arena-move-policy.js'
      - 'tests/arena-species-kit-policy.test.js'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install project-declared test dependencies
        run: npm install --no-audit --no-fund
      - name: Recover verified 0.71.3 client from Actions or persistent release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash tools/pokearena/restore-audited-alpha0713.sh site _site
          test -s _site/arena2d/lib/phaser.min.js
          test -s _site/arena2d/rights-audit-0713.json
      - name: Patch and verify only new 0.71.3 source tree
        run: |
          set -euo pipefail
          node tools/pokearena/publish-hotfix-on-alpha0713.mjs
          node --input-type=module <<'VERIFY'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='_site/arena2d',v=JSON.parse(fs.readFileSync(root+'/version.json'));
          if(v.src!=='src-5ccc174cb8'||v.modules==='src-62269b459e')
            throw Error('Pinned official client not incremented');
          const m=path.join(root,v.modules),s=fs.readFileSync(m+'/habilidades.js','utf8');
          const p=fs.readFileSync(m+'/torre2/arena-move-policy.js','utf8');
          if(!s.includes('...TORRE2_WOBBUFFET_FORMS')||
             !p.includes("'discharge':3")||!p.includes("'psybeam':3.5")||!p.includes("'hydro-pump':3.5")||!p.includes("'hidrobomba':3.5"))
            throw Error('Requested Discharge/Psybeam/Wobbuffet correction absent');
          if(!fs.existsSync(root+'/src-62269b459e/habilidades.js'))
            throw Error('Approved original source must remain for rollback');
          const earth=fs.readFileSync(m+'/torre2/batch24/runtime.js','utf8');
          const campaign=fs.readFileSync(m+'/torre2/campaign-core.js','utf8');
          if(!earth.includes('if(hit.landed)hitPoints.push({x:contact.x,y:contact.y})')||
             !earth.includes('for(const r of batch24AreaTargets(l))'))
            throw Error('Earth Power verified AoE release absent');
          if(!campaign.includes('const tier=campaignDifficultyTier(s.stage,opponent.leader,opponent.kind)')||
             !campaign.includes('const encounter=regionalTrainer(s.stage,s.trainer)'))
            throw Error('Regional campaign difficulty release absent');
          console.log('HOTFIX_ALPHA0713_SOURCE_VERIFIED',v);
          VERIFY
      - name: Unit regressions, diagnostics and Pokédex virtualization
        run: |
          node --test tests/arena-species-kit-policy.test.js tests/wobbuffet-gen45-native.test.js tests/forms-catalog-upstream.test.js tests/title-pokedex-fast-open.test.js tests/gen3-status.test.js tests/league-auto-battle.test.js tests/torre2-performance-monitor.test.js tests/torre2-pokedex-window.test.js tests/earth-power-aoe-contact.test.js tests/campaign-native-difficulty-progress.test.js
      - name: Real mobile Phaser Tyrogue and Wobbuffet, plus battle smoke
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/arena-johto-evolutions-browser.cjs
          node tests/arena-species-kit-browser.cjs
          # This pinned 0.71.3 release intentionally replaced TRAINING with
          # KANTO CAMPAIGN/LOCAL; the legacy source-client-smoke.cjs asserts
          # TRAINING exists and is inapplicable to this approved snapshot.
          # Verify actual 0.71.3 PLAY menu navigation in desktop and mobile
          node tests/alpha0713-hotfix-navigation-browser.cjs
          node tests/alpha0713-performance-browser.cjs
      - name: Save real mobile/Pokedex performance samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torre2-performance-0713-measurements
          path: test-evidence/torre2-pokedex-performance-0713.json
          if-no-files-found: warn
          retention-days: 14
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: torre2-alpha0713-hotfix-site
          path: _site/
          retention-days: 5
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: torre2-alpha0713-hotfix-failure-evidence
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 5

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: qa
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pokemon-torre-2-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: torre2-alpha0713-hotfix-site
          path: _site/
      - name: Preserve lab and link official game at root
        run: |
          set -euo pipefail
          test -s _site/arena2d/index.html
          test -s _site/RELEASE-0713-HOTFIX.json
          if [ -s _site/index.html ]; then cp _site/index.html _site/lab.html; fi
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Pokémon Torre 2 — Alpha 0.71.3</title>
          <meta http-equiv="refresh" content="0;url=./arena2d/index.html?torre2-alpha=0.71.3">
          <script>location.replace('./arena2d/index.html?torre2-alpha=0.71.3'+location.hash)</script>
          </head><body><a href="./arena2d/index.html?torre2-alpha=0.71.3">Abrir jogo</a></body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Release URL
        run: echo "Published Alpha 0.71.3 hotfix at ${{ steps.deploy.outputs.page_url }}"
