name: PB Ranked — analisar ligação entre Practice e Unranked

on:
  push:
    branches: [research/pb-ranked-rea-20261031]
    paths:
      - 'tools/research/pb-ranked-queue-context.cjs'
      - '.github/workflows/pb-ranked-queue-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check tools/research/pb-ranked-queue-context.cjs
      - run: node tools/research/pb-ranked-queue-context.cjs
