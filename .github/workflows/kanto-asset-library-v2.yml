name: Kanto pixel library v2 — integrity and zero runtime changes
on:
  push:
    branches: [feat/kanto-assets-library-20261101]
  pull_request:
    paths:
      - 'reference-assets/kanto/pixel-library-v2/**'
      - 'tests/kanto-pixel-library-v2.test.js'
      - '.github/workflows/kanto-asset-library-v2.yml'
permissions:
  contents: read
concurrency:
  group: kanto-pixel-library-${{ github.ref }}
  cancel-in-progress: true
jobs:
  asset-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate all 210 individual sprites and manifest
        run: |
          node --test tests/kanto-pixel-library-v2.test.js
          node -e "const m=require('./reference-assets/kanto/pixel-library-v2/manifest.json'); if(m.assets.length!==210) process.exit(1); console.log('210 Kanto assets checked')"
      - name: Ensure no production gameplay files modified in this asset-only PR
        run: |
          test -s reference-assets/kanto/pixel-library-v2/README.md
          test -s reference-assets/kanto/pixel-library-v2/manifest.json
