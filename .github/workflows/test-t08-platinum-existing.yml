name: T08 — Platinum somente com golpes existentes (PR 221)
on:
  push:
    branches: [feat/t08-ponyta-platinum-existing-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gates de sintaxe, reutilizacao e testes unitarios
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run check:reuse
          node --check tools/pokearena/torre2-platinum-existing-levels.js
          node --check tools/pokearena/torre2-move-pool.js
          node --test tests/platinum-existing-levels.test.js
          npm test
      - name: Capturar cliente original e compilar Phaser WebGL
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
                && node tools/pokearena/build-preview.mjs \
                && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
          node tests/kanto-151-built.test.mjs
          node tests/frlg-learnsets-built.test.mjs
          node tools/pokearena/audit-moves.mjs
      - name: Navegador Chromium com cliente real
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > test-http.log 2>&1 &
          CHROME_BIN="$(command -v google-chrome)" node tests/source-client-smoke.cjs
          CHROME_BIN="$(command -v google-chrome)" node tests/kanto-intro-touch-browser.cjs
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - name: Preservar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t08-ponyta-platinum-provas
          path: |
            test-evidence/
            test-http.log
          if-no-files-found: warn
          retention-days: 14
