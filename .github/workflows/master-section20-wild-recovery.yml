name: Script Mestre secao20 — captura selvagem e retorno depois da derrota
on:
  push:
    branches: [test/master-section20-wild-recovery-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and core regression
        run: |
          set -euo pipefail
          node --check tests/section20-wild-recovery-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build real authorized Phaser client
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
      - name: Real wild throw, rival loss, native Center and replay
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/section20-wild-recovery-browser.cjs
      - name: Original Phaser browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/source-client-smoke.cjs
          npm run test:browser
      - name: Keep proof of genuine probabilities and save states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section20-wild-capture-healing-retry
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
