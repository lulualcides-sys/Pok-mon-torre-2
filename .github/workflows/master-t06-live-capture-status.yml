name: Master T06 — live capture status and reload
on:
  push:
    branches: [fix/master-t06-live-capture-status-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and validate source
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          npm run check
          npm run check:reuse
          node --check tools/pokearena/torre2-capture-arena.js
          node --check tests/ball-choreography-browser.cjs
      - name: Capture the real Phaser client and build
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 6))
          done
          node tools/pokearena/build-preview.mjs
      - name: Validate live paralysis and burn across ball capture and reload in Chromium/WebGL
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/ball-choreography-browser.cjs
      - name: Run complete official Phaser browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - name: Preserve screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t06-live-capture-status-evidence
          path: test-evidence/
          if-no-files-found: warn
