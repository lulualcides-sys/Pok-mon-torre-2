name: PB Ranked — generate and validate full mathematical reference atlas

on:
  push:
    branches: [research/pb-ranked-175-pendentes-20261101]
    paths:
      - 'tools/research/pb-ranked-math-atlas.cjs'
      - 'tests/pb-ranked-math-atlas.test.cjs'
      - '.github/workflows/pb-ranked-math-atlas.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pb-ranked-math-atlas
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check mathematical code and original trajectory/collision formulas
        run: |
          node --check tools/research/pb-ranked-math-atlas.cjs
          node --check tests/pb-ranked-math-atlas.test.cjs
          node --test tests/pb-ranked-math-atlas.test.cjs
      - name: Build 3815-row original mathematics atlas from existing metadata
        run: node tools/research/pb-ranked-math-atlas.cjs
      - name: Rerun reproducibility and no-fabrication checks against generated JSON
        run: node --test tests/pb-ranked-math-atlas.test.cjs tests/pb-ranked-current-overlay.test.cjs tests/pb-ranked-incremental-plan.test.cjs
      - name: Commit ONLY newly derived numbers in the research branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference-library/pb-ranked/ATLAS-MATEMATICO-REA-2026-11-01.json reference-library/pb-ranked/ATLAS-MATEMATICO-RESUMO-2026-11-01.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(pb-ranked): store 3815 animation statistics and 283 move priorities'
            git pull --rebase origin research/pb-ranked-175-pendentes-20261101
            git push origin HEAD:research/pb-ranked-175-pendentes-20261101
          fi
