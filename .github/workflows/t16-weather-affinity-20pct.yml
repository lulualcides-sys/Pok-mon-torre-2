name: T16 — +20 percent weather affinity and Phaser damage checks
on:
  push:
    branches: [feat/t16-weather-type-affinity-20pct-20261030]
permissions:
  contents: read
jobs:
  climate-affinity:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify weather math and status regressions
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test tests/weather.test.js tests/gen3-status.test.js tests/t16-weather-pixels.test.js
      - name: Validate whole Node suite, VFX integrity and source policy
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run check:reuse
      - name: Rebuild the approved original Phaser/WebGL client
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json; then break; fi
            test "$i" != 4
            sleep $((i*8))
          done
      - name: Test native damage, status, weather expiration and pixel layers
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/weather-laboratory-browser.cjs
          node tests/t15-native-thunder-weather-browser.cjs
          node tests/t16-native-weather-pixels-browser.cjs
      - name: Archive weather evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t16-kanto-weather-affinity-20pct
          path: |
            test-evidence/
            _site/arena2d/version.json
          retention-days: 14
          if-no-files-found: warn
