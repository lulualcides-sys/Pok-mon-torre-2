name: Master T02 — RUN no celular e menus estáveis
on:
  push:
    branches: [test/master-t02-mobile-run-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and check
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t02-mobile-run-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build native Phaser
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Test native touchscreen RUN and battle menus
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t02-mobile-run-browser.cjs
          node tests/t02-mobile-menu-browser.cjs
      - name: Regression official original client
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t02-mobile-run-evidence
          path: |
            test-evidence/t02-mobile-*
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
