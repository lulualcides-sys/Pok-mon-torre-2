name: Mestre secao20 — primeira jornada inteira ate Brock sem atalhos
on:
  push:
    branches: [test/master-section20-brock-natural-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brock-natural:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build authorized native original Phaser client
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
      - name: 13 real trainers and full Brock gym with one starter and no forced KO
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/section20-natural-brock-browser.cjs
      - name: Archive all real encounters and last failure proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-all-thirteen-plus-brock
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
