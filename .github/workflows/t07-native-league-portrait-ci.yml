name: T07 — native League portrait import compatibility
on:
  push:
    branches: [fix/t07-native-league-portrait-import-20261029]
  pull_request:
    branches: [fix/t07-restore-two-approved-native-moves-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  league-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, syntax, reuse policy
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          npm run check
          npm run check:reuse
          node --check tools/pokearena/build-preview.mjs
          node --check tests/t07-native-league-portrait-built.test.mjs
      - name: Capture current public native client and build Phaser/WebGL
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt*8))
          done
          node tools/pokearena/build-preview.mjs
          node tests/t07-native-league-portrait-built.test.mjs
          node tests/t07-approved-native-fallbacks-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
      - name: Real Chromium boot and full browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/source-client-smoke.cjs
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t07-native-league-portrait-evidence
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14
