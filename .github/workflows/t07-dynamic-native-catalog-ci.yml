name: T07/T08 — dynamic native catalogue and Pages gates
on:
  push:
    branches: [fix/t07-dynamic-native-catalog-ci-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, JavaScript syntax and approved move integrity
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run check:reuse
          npm test
      - name: Capture and compile native Phaser client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt*8))
          done
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Exact Pages audit and Kanto 151 gates
        run: |
          set -euo pipefail
          node tools/pokearena/audit-moves.mjs
          node tests/batch24-built.test.mjs
          node tests/misty-surge-built.test.mjs
          node tests/surge3-built.test.mjs
          node tests/kanto-151-built.test.mjs
          node tests/frlg-learnsets-built.test.mjs
          node tests/t07-frlg-natural-catalog-built.test.mjs
          node tests/t08-kanto-no-duplicate-native-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
          node tests/t08-kanto-onboarding-151-built.test.mjs
          node tests/t07-frlg-unrendered-136x639-built.test.mjs
          node tests/t08-arena-role-slots-built.test.mjs
          node tests/t08-leech-seed-campaign-balance-built.test.mjs
          node tests/finale13-built.test.mjs
          node tests/t07-approved-native-overlap-built.test.mjs
      - name: Original Phaser browser smoke
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/source-client-smoke.cjs
          node tests/t08-arena-roles-summary-mobile-browser.cjs
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t07-dynamic-native-catalog-evidence
          path: test-evidence/
          retention-days: 14
          if-no-files-found: warn
