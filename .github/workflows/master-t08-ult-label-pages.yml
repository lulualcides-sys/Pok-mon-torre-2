name: T08 — weak ULT distinct real name and safe Pages release
on:
  push:
    branches: [fix/t08-ult-label-pages-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax, approved VFX and unit tests
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run check:reuse
          node --check tools/pokearena/torre2-move-pool.js
          node --check tools/pokearena/torre2-campaign-scene.js
          npm test
      - name: Native Phaser capture and Kanto battle regression
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs                 && node tools/pokearena/build-preview.mjs                 && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$n" = 4 ]; then exit 1; fi
            sleep $((n*8))
          done
          node tools/pokearena/audit-moves.mjs
          node tests/t08-duplicate-summary-names-diagnostic.mjs
          node tests/misty-surge-built.test.mjs
          node tests/frlg-learnsets-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/t08-summary-real-moves-built.test.mjs
          node tests/t08-kanto-dex-live-levels-built.test.mjs
      - name: Native mobile summary and fullscreen shield
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t08-summary-mobile-choice-browser.cjs
          CHROME_BIN="$(command -v google-chrome)" node tests/t05-summary-equip-denied-ui-browser.cjs
          CHROME_BIN="$(command -v google-chrome)" node tests/source-client-smoke.cjs
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t08-ult-label-pages-regression
          path: test-evidence/
          retention-days: 14
          if-no-files-found: warn
