name: T08 — Verify Pages blocked signatures and REA summary
on:
  push:
    branches: [fix/t08-unblock-pages-signatures-summary-smoke-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate JS syntax, native VFX policy and unit suite
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/frlg-learnsets-built.test.mjs
          node --check tests/source-client-smoke.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build actual captured Phaser version
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs \
               && test -s _site/arena2d/lib/phaser.min.js; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt*8))
          done
      - name: Replay failing Pages contracts with no ULT/HAB regression
        run: |
          set -euo pipefail
          node tools/pokearena/audit-moves.mjs > /tmp/torre-move-audit.log
          node tests/batch24-built.test.mjs
          node tests/misty-surge-built.test.mjs
          node tests/surge3-built.test.mjs
          node tests/kanto-151-built.test.mjs
          node tests/frlg-learnsets-built.test.mjs
          node tests/t07-frlg-natural-catalog-built.test.mjs
          node tests/t08-kanto-no-duplicate-native-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
          node tests/t07-frlg-unrendered-136x639-built.test.mjs
          node tests/t08-arena-role-slots-built.test.mjs
          node tests/t08-leech-seed-campaign-balance-built.test.mjs
          node tests/finale13-built.test.mjs
      - name: Real Chromium UI filters and touch fullscreen
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/source-client-smoke.cjs
          node tests/t08-arena-roles-summary-mobile-browser.cjs
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t08-pages-blocker-regression-evidence
          path: test-evidence/
          retention-days: 14
          if-no-files-found: warn
