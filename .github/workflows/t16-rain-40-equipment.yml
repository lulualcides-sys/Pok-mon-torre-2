name: T16 — equipamento Rain Dance compativel com 40 especies
on:
  push:
    branches: [feat/t16-approved-rain-dance-equipment-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rain-equipment:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar regras de clima e todas as protecoes
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test tests/weather.test.js tests/t16-weather-pixels.test.js
          npm test
          npm run check
          npm run check:reuse
      - name: Capturar e montar cliente original Phaser/WebGL
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Auditar biblioteca e 40 kits equipaveis
        run: |
          set -euo pipefail
          node tests/t16-weather-equipment-built.test.mjs
          node tests/t16-rain-40-equipment-built.test.mjs
          node tests/t08-arena-role-slots-built.test.mjs
      - name: Validar batalha climatica original Chromium
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/weather-laboratory-browser.cjs
      - name: Armazenar artefatos de verificacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t16-rain-40-approved-gear
          path: test-evidence/
          retention-days: 14
          if-no-files-found: warn
