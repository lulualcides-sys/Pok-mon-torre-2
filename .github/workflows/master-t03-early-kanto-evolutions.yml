name: Master T03 — Pidgey Caterpie Weedle seis evoluções
on:
  push:
    branches: [test/master-t03-early-kanto-evolutions-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evolutions:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check sources and approved move policy
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t03-early-kanto-evolutions-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build Phaser original
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Validar tres familias selvagens em duas transicoes EVO no WebGL
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t03-early-kanto-evolutions-browser.cjs
      - name: Preserve native WebGL screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-t03-early-evolution-artifacts
          path: |
            test-evidence/t03-early-*
            test-evidence/t03-early-evolutions.json
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
