name: T16 — AUTO tatico usa clima equipado na campanha
on:
  push:
    branches: [feat/t16-auto-tactical-weather-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auto-weather:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar AUTO/clima sem alterar nativos
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test tests/arena-auto-battle.test.js tests/weather.test.js
          npm test
          npm run check
          npm run check:reuse
      - name: Capturar cliente original e compilar Phaser/WebGL
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: AUTO realmente usa Rain Dance no jogo em Chromium
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t16-auto-weather-native-browser.cjs
      - name: Regressao do AUTO agressivo e do clima em Chromium
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t10-campaign-auto-offensive-browser.cjs
          CHROME_BIN="$(command -v google-chrome)" node tests/weather-laboratory-browser.cjs
      - name: Evidencia de execucao real
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t16-tactical-auto-weather-native
          path: test-evidence/
          retention-days: 14
          if-no-files-found: warn
