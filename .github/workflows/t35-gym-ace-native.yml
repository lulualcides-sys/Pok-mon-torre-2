name: T35 — native PMD ace sprites in gym interiors (DRAFT)
on:
  push:
    branches: [feat/t35-gym-ace-native-sprites-20261101, fix/t35-gym-ace-loader-race-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gym-aces:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Focused tests and full regressions
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-gym-ace.js
          node --check tools/pokearena/torre2-campaign-scene.js
          node --check tests/gym-ace-browser.cjs
          node --test tests/gym-ace.test.js
          npm test
          npm run check
          npm run check:reuse
      - name: Build actual original Phaser client and locally mirrored PMD sprites
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep "$((i*8))"
          done
          test -f _site/arena2d/assets/pmd/manifest.json
          source_dir=$(find _site/arena2d -maxdepth 1 -type d -name 'src-*' | head -1)
          test -n "$source_dir"
          test -f "$source_dir/torre2/gym-ace.js"
      - name: REAL Chromium desktop and mobile — Misty and Brock
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/gym-ace-browser.cjs
      - name: Upload screenshots and reports on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t35-gym-aces-real-phaser-desktop-mobile
          path: test-evidence/gym-ace/
          retention-days: 21
          if-no-files-found: warn
