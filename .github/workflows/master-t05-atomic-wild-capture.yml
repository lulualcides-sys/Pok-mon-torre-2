name: Master T05 — atomic wild capture and mobile retry
on:
  push:
    branches: [fix/t05-atomic-wild-capture-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-wild-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, unit suite and reuse policy
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-campaign-core.js
          node --check tools/pokearena/torre2-capture-arena.js
          node --check tests/t05-wild-capture-atomic-built.test.mjs
          node --check tests/t05-wild-capture-denied-ui-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build original Phaser/WebGL client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
          test -s _site/arena2d/version.json
      - name: Verify capture atomicity and persistent inventory
        run: |
          set -euo pipefail
          node --test tests/t05-wild-capture-atomic-built.test.mjs
          node --test tests/t05-bag-use-atomic-built.test.mjs
          node --test tests/t05-mart-purchase-atomic-built.test.mjs
          node --test tests/t05-backup-rollback-on-denial-built.test.mjs
          node --test tests/t05-pc-transfer-atomic-built.test.mjs
      - name: Mobile Phaser capture, existing T06 and full browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t05-wild-capture-denied-ui-browser.cjs
          node tests/t06-mobile-capture-browser.cjs
          npm run test:browser
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-t05-atomic-wild-capture
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
