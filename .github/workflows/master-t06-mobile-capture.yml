name: Master T06 — native mobile capture touch
on:
  push:
    branches: [test/t06-native-mobile-capture-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check isolated T06 test and baseline safety
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t06-mobile-capture-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Build authorized Phaser client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 6))
          done
          node tools/pokearena/build-preview.mjs
      - name: Verify two native mobile Pokeball touchscreen throws and reload
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t06-mobile-capture-browser.cjs
      - name: Run complete Phaser browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t06-mobile-capture-touch-evidence
          path: test-evidence/
          if-no-files-found: warn
