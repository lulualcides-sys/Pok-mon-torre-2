name: Kanto vector reference engine — geometry and sprite integrity
on:
  push:
    branches: [feat/kanto-vector-reference-engine-20261101]
  pull_request:
    paths:
      - 'reference-assets/kanto/vector-reference-v1/**'
      - 'tools/pokearena/torre2-vector-reference.mjs'
      - 'tools/pokearena/build-vector-reference.mjs'
      - 'tests/kanto-vector-reference.test.js'
permissions:
  contents: read
concurrency:
  group: vector-kanto-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse static scripts, all geometry and old SVG library
        run: |
          node --check tools/pokearena/torre2-vector-reference.mjs
          node --check tools/pokearena/build-vector-reference.mjs
          node --test tests/kanto-vector-reference.test.js
      - name: Verify reproducibility of committed generated SVG and manifest
        run: node tools/pokearena/build-vector-reference.mjs --check
      - name: Verify no runtime game changes relative to stacked asset PR
        run: |
          git cat-file -e 11dc781bf1bc160224e5734a8a9535d4a3b30814^{commit}
          git diff --name-only 11dc781bf1bc160224e5734a8a9535d4a3b30814 HEAD > /tmp/kanto-vector-changed.txt
          while IFS= read -r file; do
            case "$file" in
              reference-assets/kanto/vector-reference-v1/*|tools/pokearena/torre2-vector-reference.mjs|tools/pokearena/build-vector-reference.mjs|tests/kanto-vector-reference.test.js|.github/workflows/kanto-vector-reference.yml) ;;
              *) echo "Unexpected runtime path: $file"; exit 1 ;;
            esac
          done < /tmp/kanto-vector-changed.txt
          test -s reference-assets/kanto/vector-reference-v1/generated-manifest.json
