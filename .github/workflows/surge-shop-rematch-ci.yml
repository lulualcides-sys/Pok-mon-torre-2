name: Surge, TM badge gate, sprite shop and all-map VS Seeker
on:
  push:
    branches: [fix/surge-tm-sprites-all-route-rematches-20261030]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source, VFX integrity and unit tests
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run check:reuse
          for f in tools/pokearena/torre2-*.js tools/pokearena/surge3/catalog.js; do node --check "$f"; done
          npm test
      - name: Build the actual Phaser game
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs; then break; fi
            if [ "$n" -eq 3 ]; then exit 1; fi
            sleep "$((n*6))"
          done
          test -s _site/arena2d/version.json
      - name: Badge, sprites, Surge, rematches, shop regression
        run: |
          set -euo pipefail
          node --test tests/surge-shop-rematch-allmaps-built.test.mjs
          node tests/surge3-built.test.mjs
          node tests/rematches-built.test.mjs
          node --test tests/t23-kanto-mart-tm-integrity-built.test.mjs
          node --test tests/t05-mart-purchase-atomic-built.test.mjs
          node tests/misty-wild-capture-ui-built.test.mjs
      - name: Browser: original Phaser and mobile rematch
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node tests/source-client-smoke.cjs
          node tests/t22-mobile-rematch-reload-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surge-shop-rematches-regression-evidence
          path: test-evidence/
          if-no-files-found: warn
