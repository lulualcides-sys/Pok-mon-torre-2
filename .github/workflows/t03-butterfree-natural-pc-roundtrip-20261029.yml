name: T03/T05 — earned Butterfree PC full persistence
on:
  push:
    branches: [test/t03-butterfree-natural-pc-roundtrip-safe-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  natural-pc:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, syntax, approved native FX and save security
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t03-caterpie-butterfree-full-chain-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Capture native authorized Phaser client and build WebGL
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
               && node tools/pokearena/build-preview.mjs \
               && test -s _site/arena2d/version.json; then break; fi
            if [ "$i" -eq 4 ]; then exit 1; fi
            sleep $((i*8))
          done
      - name: Genuine Caterpie XP, two evolutions, PC deposit and withdrawal, double reload
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t03-caterpie-butterfree-full-chain-browser.cjs
      - name: PC immutable saves and browser-wide regression
        run: |
          set -euo pipefail
          node tests/t05-pc-transfer-atomic-built.test.mjs
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t05-pc-save-denied-ui-browser.cjs
          npm run test:browser
      - name: Preserve evidence even if a battle fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t03-t05-earned-butterfree-pc-two-reloads
          path: |
            test-evidence/t03-caterpie-chain-*.png
            test-evidence/t03-caterpie-chain-earned-evolution.json
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
