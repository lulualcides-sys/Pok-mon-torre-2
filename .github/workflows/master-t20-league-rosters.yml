name: Master T20 — League roster integrity
on:
  push:
    branches: [test/master-t20-league-roster-invariants-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t20-league-rosters:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and verify original code
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and build original Phaser client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Check all five League boss rosters and Agatha levels
        run: |
          set -euo pipefail
          node --test tests/t20-league-roster-built.test.mjs
      - name: Official native browser regressions
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
