name: T08 — summary upcoming level unlocks
on:
  push:
    branches: [feat/t08-summary-upcoming-levels-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  summary-levels:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, syntax, licenses and approved effects
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-move-pool.js
          node --check tools/pokearena/torre2-campaign-scene.js
          node --check tests/t08-summary-upcoming-151-built.test.mjs
          node --check tests/t08-summary-upcoming-mobile-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Capture original client and build Phaser/WebGL
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
               && node tools/pokearena/build-preview.mjs \
               && test -s _site/arena2d/version.json; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt*8))
          done
      - name: Verify exact 151 Kanto levels and summary without TM grants
        run: |
          set -euo pipefail
          node tests/t08-summary-upcoming-151-built.test.mjs
          node tests/t08-kanto-dex-live-levels-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
          node tests/t08-editor-slot-suggestion-built.test.mjs
          node tests/t08-ult-saved-versus-battle-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
      - name: Native touchscreen, autosave protection and browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t08-summary-upcoming-mobile-browser.cjs
          node tests/t08-summary-mobile-choice-browser.cjs
          node tests/t08-arena-roles-summary-mobile-browser.cjs
          npm run test:browser
      - name: Screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t08-summary-upcoming-levels-evidence
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14
