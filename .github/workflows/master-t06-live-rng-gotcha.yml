name: Master T06 — live RNG successful GOTCHA
on:
  push:
    branches: [test/master-t06-live-rng-gotcha-20261028]
permissions:
  contents: read
jobs:
  caught:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --no-audit --no-fund
          node --check tests/t06-live-rng-gotcha-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - run: |
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - run: CHROME_BIN="$(command -v google-chrome)" node tests/t06-live-rng-gotcha-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t06-live-rng-gotcha
          path: test-evidence/
