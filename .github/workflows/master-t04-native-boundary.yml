name: Master T04 — Phaser switch and pending impact isolation
on:
  push:
    branches: [test/master-t04-native-boundary-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t04-native-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Focused boundary tests and source checks
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t04-native-switch-pending-hits-browser.cjs
          node --test tests/combat-boundary.test.js tests/t04-two-transitions.test.js
          npm run check
          npm run check:reuse
          npm test
      - name: Build original Phaser/WebGL client
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Native pointer switch and KO boundary Chromium
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t04-native-switch-pending-hits-browser.cjs
      - name: Full browser regression suite
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Preserve boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t04-native-boundary-evidence
          path: |
            test-evidence/t04-native-*
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
