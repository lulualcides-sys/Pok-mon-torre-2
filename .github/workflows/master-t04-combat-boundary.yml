name: Master T04 — fronteira de projéteis em troca e KO
on:
  push:
    branches: [fix/master-t04-boundary-idempotent-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combat-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source integrity and focused KO/projéteis tests
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-combat-boundary.js
          node --test tests/combat-boundary.test.js
          npm run check
          npm run check:reuse
          npm test
      - name: Build original Phaser WebGL client
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Live party switches and KO recovery regressions
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t02-mobile-menu-browser.cjs
          node tests/t02-desktop-run-browser.cjs
      - name: Entire official browser regression suite
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Retain native browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t04-projectile-boundary-evidence
          path: |
            test-evidence/t02-mobile-*
            test-evidence/t02-desktop-*
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
