name: Poké Arena 2D — monitor independente do cliente original
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/pokearena/watch-upstream.mjs'
      - 'tools/pokearena/capture-core-public.mjs'
      - 'tests/capture-core-public.test.mjs'
      - 'tests/watch-upstream.test.mjs'
      - '.github/workflows/pokearena-upstream-watch.yml'
  push:
    branches: [main]
    paths:
      - 'tools/pokearena/watch-upstream.mjs'
      - 'tests/watch-upstream.test.mjs'
      - '.github/workflows/pokearena-upstream-watch.yml'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: pokearena-independent-upstream-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar sonda isolada sem alterar o jogo
        run: node --test tests/watch-upstream.test.mjs
      - name: Consultar origem e verificar saúde das capturas
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/pokearena/watch-upstream.mjs
      - name: Arquivar resultado mesmo se origem estiver bloqueada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokearena-independent-upstream-status
          path: site-capture/upstream-watch.json
          if-no-files-found: warn
          retention-days: 14
      - name: Abrir ou atualizar alerta sem duplicar issues
        if: github.event_name != 'pull_request' && steps.probe.outputs.attention == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {incident} from './tools/pokearena/watch-upstream.mjs';
          const report=JSON.parse(fs.readFileSync('site-capture/upstream-watch.json', 'utf8'));
          fs.writeFileSync('/tmp/torre2-upstream-incident.md',incident(report));
          JS
          title='[UPSTREAM] Poké Arena 2D — atualização ou captura pendente'
          issue="$(gh issue list --repo "$GH_REPO" --state all --limit 100 --json title,number | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -1)"
          if [ -z "$issue" ]; then
            gh issue create --repo "$GH_REPO" --title "$title" --body-file /tmp/torre2-upstream-incident.md
          else
            gh issue view "$issue" --repo "$GH_REPO" --json body --jq '.body' > /tmp/torre2-upstream-previous.md
            if ! cmp -s /tmp/torre2-upstream-previous.md /tmp/torre2-upstream-incident.md; then
              gh issue edit "$issue" --repo "$GH_REPO" --body-file /tmp/torre2-upstream-incident.md
            fi
            state="$(gh issue view "$issue" --repo "$GH_REPO" --json state --jq '.state')"
            if [ "$state" != OPEN ]; then gh issue reopen "$issue" --repo "$GH_REPO"; fi
          fi

  official-code-audit:
    # This audit is independent of the sprites/title needed by playable builds.
    # Missing genuine assets MUST still block full Phaser publication.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate fail-closed source checking without network dependencies
        run: |
          node --check tools/pokearena/capture-core-public.mjs
          node --test tests/capture-core-public.test.mjs
      - name: Verify current official Alpha and native JavaScript
        if: github.event_name != 'pull_request'
        run: node tools/pokearena/capture-core-public.mjs
      - name: Keep upstream evidence even on an HTTP 403
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pokearena-official-code-audit
          path: |
            site-capture/upstream-core.json
            site-capture/official-js/
          if-no-files-found: warn
          retention-days: 14
