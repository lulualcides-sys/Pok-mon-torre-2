name: Master T03 — sprite e WebGL após evolução
on:
  push:
    branches: [test/master-t03-evolution-visual-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evolved-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and check native game
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t03-evolution-visual-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Compile real native Phaser
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Evolve Magikarp, inspect real Gyarados WebGL sprite, attack via touch
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t03-evolution-visual-browser.cjs
      - name: Save WebGL screenshot and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-t03-evolution-visual-evidence
          path: |
            test-evidence/t03-evolution-*
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
