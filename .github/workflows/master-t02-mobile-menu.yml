name: Master T02 — menu FIGHT BAG Pokémon no celular
on:
  push:
    branches: [test/master-t02-mobile-menu-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependencies and basic integrity
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t02-mobile-menu-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Capture and build original native Phaser client
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Touch live FIGHT, BAG and Pokemon switch without altering player save
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t02-mobile-menu-browser.cjs
      - name: Archive screenshots and results on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t02-mobile-menu-evidence
          path: |
            test-evidence/t02-mobile-*
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
