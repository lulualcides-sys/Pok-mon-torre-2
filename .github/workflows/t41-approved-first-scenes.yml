name: T41 - approved first Kanto scenes (isolated)
on:
  push:
    branches: [feat/t41-approved-map-first-playable-scenes-20261102]
  pull_request:
    paths:
      - 'tools/pokearena/torre2-prologue-reference-sheets.js'
      - 'tests/t59-original-prologue-references.test.mjs'
      - 'reference-assets/kanto/**'
      - 'tools/pokearena/torre2-approved-prologue-assets.js'
      - 'tools/pokearena/torre2-approved-maps-atlas.js'
      - 'tests/t54-prologue-sidecar.test.mjs'
      - 'tools/pokearena/torre2-approved-map-first-scenes.js'
      - 'tools/pokearena/torre2-approved-map-renderer.js'
      - 'tools/pokearena/torre2-campaign-scene.js'
      - 'tools/pokearena/install-approved-maps.py'
      - 'tests/approved-map-first-scenes.test.mjs'
      - 'tests/test_install_approved_maps.py'
      - 'tests/approved-map-binary-integrity.test.mjs'
      - 'assets/ui/kanto-approved-maps/**'
      - 'tools/pokearena/build-preview.mjs'
      - '.github/workflows/t41-approved-first-scenes.yml'
permissions:
  contents: read
jobs:
  first-scenes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse changed runtime modules and Python installer
        run: |
          node --check tools/pokearena/torre2-prologue-reference-sheets.js
          node --check tools/pokearena/torre2-approved-prologue-assets.js
          node --check tools/pokearena/torre2-approved-maps-atlas.js
          node --check tools/pokearena/torre2-approved-opening.js
          node --check tools/pokearena/torre2-approved-map-first-scenes.js
          node --check tools/pokearena/torre2-approved-map-renderer.js
          node --check tools/pokearena/torre2-campaign-scene.js
          node --check tools/pokearena/build-preview.mjs
          node --check tools/pokearena/torre2-native-asset-compat.mjs
          python3 -m py_compile tools/pokearena/install-approved-maps.py
          python3 -m unittest discover -s tests -p 'test_install_approved_maps.py' -v
      - name: Coordinate, navigation, and regression tests
        run: |
          node --test tests/approved-map-first-scenes.test.mjs tests/approved-map-renderer.test.mjs tests/approved-maps-atlas.test.mjs tests/native-asset-compat.test.mjs tests/approved-map-build-integration.test.mjs tests/approved-map-binary-integrity.test.mjs tests/t51-approved-maps-and-start.test.mjs tests/t54-prologue-sidecar.test.mjs tests/t59-original-prologue-references.test.mjs
      # Native Phaser build and Chromium desktop/mobile are already gated by
      # visual-guard.yml, which captures the upstream client first. Never
      # duplicate that network-heavy setup in this fast integrity job.
