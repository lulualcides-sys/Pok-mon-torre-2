name: Master T31 — critical Phaser capture recovery
on:
  push:
    branches: [fix/t31-critical-capture-retry-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit tests, syntax and preservation gates
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/capture-client.mjs
          node --check tools/pokearena/capture-client-critical.mjs
          node --test tests/capture-client-critical.test.js
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and build original Phaser client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
          node -e "const d=require('./site-capture/CAPTURE-REPORT.json');if(!d.criticalRecovery)process.exit(1);console.log('Critical modules recovered:',JSON.stringify(d.criticalRecovery))"
      - name: Full Phaser Chromium/WebGL regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t31-capture-critical-evidence
          path: |
            site-capture/CAPTURE-REPORT.json
            _site/arena2d/version.json
            test-evidence/
          if-no-files-found: warn
          retention-days: 14
