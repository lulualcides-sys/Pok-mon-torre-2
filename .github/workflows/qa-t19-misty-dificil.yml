name: QA T19 — real Misty Gym native difficult AUTO tactics
on:
  push:
    branches: [qa/t19-misty-auto-dificil-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-t19-misty-native-dificil:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, syntax and move provenance
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t19-natural-misty-gym-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and build original native Phaser client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Play Misty two-fighter Gym battle with native AUTO
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t19-natural-misty-gym-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-t19-misty-dificil-evidence
          path: test-evidence/
          if-no-files-found: warn
