name: T19 — natural Vermilion recovery by wild XP and capture
on:
  push:
    branches: [test/t19-vermilion-earned-grind-capture-20261031]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-grind:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source, safety and existing XP/capture mechanics
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t19-vermilion-earned-grind-capture-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Build approved original Phaser client
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs &&
               node tools/pokearena/build-preview.mjs &&
               test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$i" -eq 4 ]; then exit 1; fi
            sleep "$((i*8))"
          done
      - name: Download exact five-trainer earned save from proof CI
        uses: actions/download-artifact@v4
        with:
          name: t19-earned-vermilion-five-native
          run-id: 41198922681
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: test-evidence
      - name: Two real wild XP battles plus one probabilistic Pokeball
        env:
          CHROME_BIN: /usr/bin/google-chrome
          EARNED_VERMILION_SAVE: test-evidence/t19-earned-vermilion-five-save.json
        run: |
          set -euo pipefail
          node tests/t19-vermilion-earned-grind-capture-browser.cjs
      - name: Archive genuine save and screenshots or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t19-earned-vermilion-grind-capture
          path: |
            test-evidence/t19-vermilion-grind-capture-report.json
            test-evidence/t19-vermilion-earned-grind-save.json
            test-evidence/t19-vermilion-earned-recovery*.png
          retention-days: 21
          if-no-files-found: warn
