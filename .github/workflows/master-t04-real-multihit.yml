name: Master T04 — native Double Kick switch regression
on:
  push:
    branches: [test/t04-real-multihit-boundary-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t04-multihit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit tests, syntax and protection gates
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test tests/t04-two-transitions.test.js
          npm run check
          npm run check:reuse
          npm test
      - name: Build Phaser/WebGL client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
          node --test tests/t04-native-doublekick-boundary-built.test.mjs
      - name: Chromium native pointer switch and full browser suite
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t04-native-switch-pending-hits-browser.cjs
          npm run test:browser
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t04-native-doublekick-boundary
          path: |
            test-evidence/t04-native-*
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
