name: T31 — REA built-client Mart badge regression
on:
  push:
    branches: [fix/t31-rea-tm-badge-regression-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rea-mart-badge:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source and regression test
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/solo-kanto-built.test.mjs
          npm test
          npm run check
          npm run check:reuse
      - name: Build real captured Phaser client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs && test -s _site/arena2d/version.json; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Regress shop badge gates in the built client
        run: |
          set -euo pipefail
          node tests/solo-kanto-built.test.mjs
      - name: Full Phaser Chromium browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: t31-rea-mart-diagnostics
          path: |
            test-evidence/
            artifacts/diagnostic.md
          if-no-files-found: warn
          retention-days: 14
