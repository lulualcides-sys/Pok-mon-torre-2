name: Master T22 — VS Seeker mobile restart and anti-duplicate
on:
  push:
    branches: [test/master-t22-mobile-rematch-reload-20261028]
  pull_request:
    paths:
      - 'tools/pokearena/torre2-rematch-policy.js'
      - 'tools/pokearena/torre2-campaign-scene.js'
      - 'tests/rematch-policy.test.js'
      - 'tests/t22-mobile-rematch-reload-browser.cjs'
      - '.github/workflows/master-t22-mobile-rematch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t22-mobile-rematch:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, syntax and move preservation
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t22-mobile-rematch-reload-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and build authorized Phaser client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
               && node tools/pokearena/build-preview.mjs \
               && test -s _site/arena2d/version.json; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Real mobile Chromium VS Seeker interrupted rematch and reload
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t22-mobile-rematch-reload-browser.cjs
      - name: Full original Phaser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t22-vs-seeker-mobile-reload-proof
          path: test-evidence/
          if-no-files-found: warn
