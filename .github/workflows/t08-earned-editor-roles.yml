name: T08 — learned Kanto editor roles and saved battle moves
on:
  push:
    branches: [fix/t08-earned-moves-editor-slots-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  earned-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, reuse policy and full unit suite
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-move-pool.js
          node --check tests/t08-editor-earned-moves-built.test.mjs
          npm run check
          npm run check:reuse
          npm test
      - name: Capture and build real versioned Phaser WebGL client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$n" = 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: T07/T08 151 species x 227 attacks, learned roles and save reload
        run: |
          set -euo pipefail
          node tools/pokearena/audit-moves.mjs
          node tests/t07-frlg-natural-catalog-built.test.mjs
          node tests/t07-151-movesets-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/t08-editor-earned-moves-built.test.mjs
          node tests/t05-summary-equip-atomic-built.test.mjs
      - name: Native Chromium touch and full Phaser browser regressions
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/kanto-intro-touch-browser.cjs
          node tests/t05-summary-equip-denied-ui-browser.cjs
          npm run test:browser
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t08-earned-editor-evidence
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
