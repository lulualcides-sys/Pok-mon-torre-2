name: Master T03 — Weedle Kakuna Beedrill via XP earned
on:
  push:
    branches: [test/master-t03-weedle-beedrill-natural-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t03-weedle-earned-evolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar e validar sintaxe, regras e testes unitários
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t03-weedle-beedrill-full-chain-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Capturar e compilar o cliente Phaser original
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Ganhar XP real até Beedrill com duas evoluções consecutivas em campanha
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t03-weedle-beedrill-full-chain-browser.cjs
      - name: Regressão oficial do jogo no navegador
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Guardar provas visuais e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t03-weedle-full-chain-evidence
          path: |
            test-evidence/t03-weedle-chain-*.png
            test-evidence/t03-weedle-chain-earned-evolution.json
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
