name: Master T19 — native AUTO brain refresh when campaign Pokémon switch
on:
  push:
    branches: [fix/master-t19-auto-rebind-after-switch-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t19-auto-rebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, syntax and move provenance
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t19-auto-party-rebind-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and build original native Phaser client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Play real Phaser party switch and validate native AUTO brain replacement
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t19-auto-party-rebind-browser.cjs
      - name: Official original Phaser browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t19-auto-rebind-evidence
          path: test-evidence/
          if-no-files-found: warn
