name: PB Ranked — diferenciar Practice vs Bot e fila Unranked

on:
  push:
    branches: [research/pb-ranked-rea-20261031]
    paths:
      - 'tools/research/pb-ranked-queue-semantics.cjs'
      - '.github/workflows/pb-ranked-queue-semantics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-public-client-menu-labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check tools/research/pb-ranked-queue-semantics.cjs
      - name: Analyze public menu and queue literals without caching source code
        run: node tools/research/pb-ranked-queue-semantics.cjs
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference-library/pb-ranked/SEMANTICA-FILA-PRACTICE-VS-UNRANKED.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: index public practice and unranked queue semantics with no source code'
            git pull --rebase origin research/pb-ranked-rea-20261031
            git push origin HEAD:research/pb-ranked-rea-20261031
          fi
