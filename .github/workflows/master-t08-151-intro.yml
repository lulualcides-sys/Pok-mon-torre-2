name: Master T08 — 151 early-level loadout gates
on:
  push:
    branches: [test/t08-151-intro-level-gates-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source and policy
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t08-kanto-onboarding-151-built.test.mjs
          npm test
          npm run check
          npm run check:reuse
      - name: Build original Phaser game
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 6))
          done
          node tools/pokearena/build-preview.mjs
      - name: Audit all 151 level-5, level-7 and level-8 loadouts
        run: |
          set -euo pipefail
          node tests/t08-kanto-onboarding-151-built.test.mjs
          node tests/frlg-learnsets-built.test.mjs
          node tests/misty-surge-built.test.mjs
      - name: Validate full Phaser browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t08-151-intro-audit-evidence
          path: test-evidence/
          if-no-files-found: warn
