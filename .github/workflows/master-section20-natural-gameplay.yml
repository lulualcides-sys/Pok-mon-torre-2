name: Section 20 — gameplay natural primeiro treinador
on:
  push:
    branches: [test/master-section20-natural-opening-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  natural-gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Capture original Phaser and compile
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
      - name: First trainer from level-5 starter via real AUTO (no forced KO)
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/section20-natural-route-browser.cjs
      - name: Preserve evidence even if battle fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-route1-diagnostic
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
