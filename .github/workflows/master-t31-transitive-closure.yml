name: Master T31 — transitive Phaser module closure
on:
  push:
    branches: [fix/t31-relative-module-recovery-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phaser-module-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit tests and source preservation
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/capture-client.mjs
          node --check tools/pokearena/capture-client-critical.mjs
          node --test tests/capture-client-critical.test.js
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and build complete Phaser client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: First-boot original Phaser Chromium smoke
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/source-client-smoke.cjs
      - name: Full game Chromium/WebGL regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t31-transitive-closure-evidence
          path: |
            site-capture/CAPTURE-REPORT.json
            _site/arena2d/version.json
            test-evidence/
          if-no-files-found: warn
          retention-days: 14
