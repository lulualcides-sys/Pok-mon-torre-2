name: T19 - Gym climate-aware AI, original WebGL and regression
on:
  push:
    branches: [feat/t19-climate-smart-gym-ai-20261030]
permissions:
  contents: read
jobs:
  leader-weather:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Focused behavior tests plus all code and VFX safety gates
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-trainer-strategy.js
          node --check tools/pokearena/torre2-party-battle.js
          node --test tests/trainer-strategy.test.js tests/gym-leader-challenge.test.js tests/weather.test.js
          npm test
          npm run check
          npm run check:reuse
      - name: Build original Phaser WebGL client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs && test -s _site/arena2d/version.json; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt*7))
          done
      - name: Test real leader, native recalls and browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/trainer-strategy-browser.cjs
          node tests/t19-gym-leader-challenge-browser.cjs
          npm run test:browser
      - name: Archive native proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t19-weather-gym-original-phaser
          path: |
            test-evidence/
            _site/arena2d/version.json
          retention-days: 14
          if-no-files-found: warn
