name: T80 import only the user-uploaded Lt Surge background (isolated)
on:
  push:
    branches: [feat/t80-surge-user-map-and-leader-ace-grounding-20261103]
    paths: ['.github/workflows/t80-import-user-surge-map.yml']
permissions:
  contents: write
concurrency:
  group: t80-user-surge-image-import
  cancel-in-progress: false
jobs:
  install-original-user-image:
    name: Validate exact upload and store WebP override only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Isolated image converter dependency
        run: |
          python3 -m venv /tmp/t80-image-converter
          /tmp/t80-image-converter/bin/pip install --disable-pip-version-check Pillow
      - name: Import exact uploaded PNG, verify SHA-256 and create WebP
        env:
          USER_SURGE_PNG_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/2f190171-c813-420a-907d-d45dc7defbc2.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjRmYWFjMDYxNzJlZTY2MSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzg1NTIzOH0.nDMTxGgLdcQMfe-0f05qdDCy0ayHZbxqMAaWUW-gAp0"
        run: |
          set -euo pipefail
          /tmp/t80-image-converter/bin/python tools/pokearena/import-user-surge-map.py --url "$USER_SURGE_PNG_URL"
          test -s assets/ui/kanto-overrides/gym-surge-user.webp
          test -s assets/ui/kanto-overrides/gym-surge-user.json
      - name: Commit only override and provenance into isolated staging branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/kanto-overrides/gym-surge-user.webp assets/ui/kanto-overrides/gym-surge-user.json
          if git diff --cached --quiet; then
            echo "::error::Expected user image upload to create an override"
            exit 1
          fi
          git commit -m "assets(T80): user-uploaded Surge gym WebP only, preserve 60 originals"
          git push origin "HEAD:refs/heads/feat/t80-surge-user-map-and-leader-ace-grounding-20261103"
