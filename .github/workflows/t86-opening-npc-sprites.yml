name: T86 — treinador FireRed como sprite nativo, sem NPC pintado

on:
  pull_request:
    branches: [preview/homologacao-jogavel-20261103]
    paths:
      - '.github/workflows/t86-opening-npc-sprites.yml'
      - 'tools/pokearena/torre2-opening-npc-overlays.js'
      - 'tools/pokearena/torre2-campaign-scene.js'
      - 'tools/pokearena/build-preview.mjs'
      - 'tests/t86-opening-npc-overlays.test.mjs'
      - 'tests/t87-user-opening-navigation.test.mjs'
      - 'tools/pokearena/produce-opening-user-webps.py'
      - 'assets/ui/kanto-opening-user/original/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sprite-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate native sprite modules
        run: |
          node --check tools/pokearena/torre2-opening-npc-overlays.js
          node --check tools/pokearena/torre2-campaign-scene.js
          node --check tools/pokearena/build-preview.mjs
      - name: No duplication and coordinates regression
        run: |
          node --test tests/t86-opening-npc-overlays.test.mjs tests/t87-user-opening-navigation.test.mjs
          python -m py_compile tools/pokearena/produce-opening-user-webps.py
          (cd assets/ui/kanto-opening-user/original && sha256sum -c - <<'CHECKS'
          182307b602cb8cd2365610bbb183f0da74ac3f260e045f6b94ea8fde533df9de  pallet-town.jpg
          919109d3a492708c87c38a858f40c094783dc1462ea98382e2139820f8202366  route-1.jpg
          cfbf218967faf1e12da38bba3a307005a3f63ff36d20dd563ef543d7fbd02430  viridian-city.jpg
          3f2dd05bb0e3028795dd0ca51cd5828bb415be6da536e476d7ce74b9cbe0f03d  viridian-forest.jpg
          CHECKS
          )
      - name: Protect original approved images
        run: |
          node tools/dev/approved-visual-guard.mjs
          node --test tests/approved-map-binary-integrity.test.mjs
