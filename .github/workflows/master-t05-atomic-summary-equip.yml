name: Master T05 — atomic native summary equip
on:
  push:
    branches: [fix/t05-summary-equip-save-atomic-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, full unit suite and four-source move preservation
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-campaign-core.js
          node --check tools/pokearena/torre2-campaign-scene.js
          node --check tests/t05-summary-equip-atomic-built.test.mjs
          node --check tests/t05-summary-equip-denied-ui-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build original versioned Phaser/WebGL client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
          test -s _site/arena2d/version.json
      - name: Verify compiled move equip and related save regressions
        run: |
          set -euo pipefail
          node --test tests/t05-summary-equip-atomic-built.test.mjs
          node --test tests/t05-active-selection-atomic-built.test.mjs
          node --test tests/t05-backup-rollback-on-denial-built.test.mjs
          node --test tests/t05-bag-use-atomic-built.test.mjs
          node --test tests/t07-151-movesets-built.test.mjs
      - name: Native mobile Phaser equip, summary and complete browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t05-summary-equip-denied-ui-browser.cjs
          node tests/t05-active-selection-denied-ui-browser.cjs
          npm run test:browser
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-t05-atomic-summary-equip
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
