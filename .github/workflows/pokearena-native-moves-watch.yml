name: Poké Arena 2D — catálogo de golpes nativos
on:
  schedule:
    # Daily source-version probe; UTC 12:11 = 09:11 Sao Paulo.
    - cron: '11 12 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/pokearena/sync-source-moves.mjs'
      - 'tools/pokearena/catalog-preflight.mjs'
      - 'tools/pokearena/pmd-source-preflight.mjs'
      - 'tools/pokearena/capture-gate.mjs'
      - 'tests/catalog-preflight.test.mjs'
      - 'tests/pokearena-source-catalog.test.js'
      - '.github/workflows/pokearena-native-moves-watch.yml'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: pokearena-native-moves-watch
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate library compiler and existing move protections
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/sync-source-moves.mjs
          node --check tools/pokearena/audit-moves.mjs
          node --test tests/pokearena-source-catalog.test.js tests/catalog-preflight.test.mjs tests/capture-gate-policy.test.js
          npm run check
          npm run check:reuse
          npm test
      - name: Verify real audited 0.71.3 native client without asserting a new upstream capture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash tools/pokearena/prepare-audited-qa.sh
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/alpha0713-hotfix-navigation-browser.cjs
          node tests/arena-species-kit-browser.cjs
  catalog:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check official VERSION and critical PMD readiness before full capture
        id: probe
        run: node tools/pokearena/catalog-preflight.mjs
      - name: Preserve probe status even if upstream is unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokearena-native-catalog-preflight
          path: site-capture/catalog-preflight.json
          if-no-files-found: warn
          retention-days: 14
      - name: Capture updated public Phaser modules with retries
        if: steps.probe.outputs.capture == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          for attempt in 1 2 3; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt*10))
          done
          node tools/pokearena/build-preview.mjs
          node tools/pokearena/audit-moves.mjs
      - name: Compile strictly metadata-only upstream move library
        if: steps.probe.outputs.capture == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/pokearena/sync-source-moves.mjs
          node tools/pokearena/sync-source-moves.mjs
          node -e "const c=require('./data/pokearena2d-source-moves.json');if(c.originalMoveCount!==c.moves.length||new Set(c.moves.map(x=>x.id)).size!==c.moves.length)process.exit(1);console.log('Unique native moves:',c.moves.length)"
      - name: Store audit for debugging without publishing source assets
        if: steps.probe.outputs.capture == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pokearena-native-catalog-audit
          path: |
            site-capture/POKEARENA-MOVE-AUDIT.json
            site-capture/CAPTURE-REPORT.json
          retention-days: 14
          if-no-files-found: error
      - name: Propose verified catalog metadata as a reviewable draft PR (never auto-commit to main)
        if: steps.probe.outputs.capture == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/pokearena2d-source-moves.json data/pokearena2d-source-changes.json
          if git diff --cached --quiet; then
            echo 'Official metadata unchanged after audit; main untouched.'
            exit 0
          fi
          source="$(node -p "require('./data/pokearena2d-source-moves.json').siteVersion")"
          [[ "$source" =~ ^src-[a-f0-9]{10}$ ]] || { echo '::error::Invalid source hash'; exit 1; }
          branch="bot/native-catalog-${source#src-}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::warning::Catalog review branch $branch already exists; no duplicate or force push."
            exit 0
          fi
          git switch -c "$branch"
          git commit -m "catalog: verified native move metadata from $source"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo '::error::Catalog drift conflicts with main; not overwriting any changes.'
            exit 1
          fi
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --draft --head "$branch" --base main \
            --title "Catalog native Poké Arena source $source (metadata only)" \
            --body "Read-only public source captured and audited. Metadata diff only. Check rights, VFX, kits, saves, full Phaser visual QA before merging. No automatic native gameplay changes."
