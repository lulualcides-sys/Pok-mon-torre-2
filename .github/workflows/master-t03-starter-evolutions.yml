name: Master T03 — evoluções visuais dos 3 iniciais Kanto
on:
  push:
    branches: [test/master-t03-starter-evolutions-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-starters:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check repository and source integrity
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t03-starter-evolutions-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build real versioned Phaser
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Real EVO input and WebGL sprites for three Kanto starters
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t03-starter-evolutions-browser.cjs
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t03-starter-evolutions-evidence
          path: |
            test-evidence/t03-evolution-*
            test-evidence/t03-starter-evolutions.json
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
