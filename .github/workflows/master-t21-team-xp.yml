name: Master T21 — built party XP and caps
on:
  push:
    branches: [test/master-t21-whole-party-xp-cap-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t21-team-xp:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, syntax and approved move checks
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t21-built-whole-party-xp.test.mjs
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and compile authorized Phaser game
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Audit trainer/wild/defeat XP, full party and hard level caps
        run: |
          set -euo pipefail
          node --test tests/t21-built-whole-party-xp.test.mjs
      - name: Official complete Phaser browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t21-party-xp-and-caps
          path: test-evidence/
          if-no-files-found: warn
