name: Master T19 — genuine Cerulean finish and Misty
on:
  push:
    branches: [test/t19-cerulean-misty-native-20261031]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  earned-save-misty:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source and approved runtime
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t19-earned-cerulean-misty-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Build genuine Phaser/WebGL client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs && test -s _site/arena2d/version.json; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Download exact earned ten-trainer save from green CI
        uses: actions/download-artifact@v4
        with:
          name: t19-ten-earned-cerulean
          run-id: 41178359400
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: test-evidence
      - name: Download verified trainer-15 checkpoint from native failed Misty UI run
        uses: actions/download-artifact@v4
        with:
          name: t19-earned-misty-native
          run-id: 41189585783
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: test-evidence/resume
      - name: Play five remaining trainers and Misty with native Phaser
        run: |
          set -euo pipefail
          test -s test-evidence/t19-earned-cerulean-ten-save.json
          test -s test-evidence/resume/t19-native-cerulean-earned-checkpoint.json
          T19_EARNED_CHECKPOINT=test-evidence/resume/t19-native-cerulean-earned-checkpoint.json CHROME_BIN="$(command -v google-chrome)" node tests/t19-earned-cerulean-misty-browser.cjs
      - name: Full native Phaser browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - name: Archive real Misty proof and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t19-earned-misty-native
          path: |
            test-evidence/t19-earned-cerulean-misty-report.json
            test-evidence/t19-misty-*
            test-evidence/t19-native-cerulean-*
            test-evidence/t19-before-misty-native.png
            test-evidence/t19-earned-misty-save.json
          retention-days: 21
          if-no-files-found: warn
