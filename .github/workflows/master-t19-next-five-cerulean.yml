name: Master T19 — Cerulean trainers 6-10 with true battles and reload
on:
  push:
    branches: [test/master-t19-cerulean-next-five-20261028]
permissions:
  contents: read
jobs:
  cerulean-next-five:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --no-audit --no-fund
          node --check tests/t19-five-native-cerulean-reload-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - run: |
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - run: T19_CERULEAN_START=5 CHROME_BIN="$(command -v google-chrome)" node tests/t19-five-native-cerulean-reload-browser.cjs
      - run: CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t19-next-five-cerulean-native
          path: test-evidence/
