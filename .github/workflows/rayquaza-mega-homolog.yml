name: Rayquaza e Mega — homologação Phaser jogável

on:
  pull_request:
    branches: [test/homologacao-kanto-20261103]
    paths:
      - '.github/workflows/rayquaza-mega-homolog.yml'
      - 'tools/pokearena/torre2-rayquaza-preview.mjs'
      - 'tools/pokearena/build-preview.mjs'
      - 'tests/rayquaza-mega-preview.test.js'
      - 'tests/rayquaza-mega-built.test.mjs'
      - 'tests/rayquaza-mega-browser.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rayquaza-real-phaser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar sintaxe e contratos sem o cliente
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/pokearena/build-preview.mjs
          node --check tools/pokearena/torre2-rayquaza-preview.mjs
          node --check tests/rayquaza-mega-browser.cjs
          node --test tests/rayquaza-mega-preview.test.js
      - name: Preparar navegador
        run: npm install --no-audit --no-fund
      - name: Capturar cliente publico atualizado (somente testes)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt*8))
          done
      - name: Gerar a campanha Phaser com Rayquaza e Mega
        run: node tools/pokearena/build-preview.mjs
      - name: Validar duas formas, movimentos e sprites reais
        run: node tests/rayquaza-mega-built.test.mjs
      - name: Abrir no Chromium, selecionar Rayquaza, lutar e megaevoluir
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/rayquaza-mega-browser.cjs
      - name: Evidencia visual da batalha e erros de compatibilidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rayquaza-mega-homolog-battle
          path: |
            test-evidence/rayquaza-mega-real-phaser.png
            site-capture/CAPTURE-REPORT.json
          if-no-files-found: ignore
          retention-days: 7
