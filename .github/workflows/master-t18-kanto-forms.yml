name: Master T18 — 151 Kanto identities and sprites
on:
  push:
    branches: [test/master-t18-kanto-identity-151-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t18-kanto-forms:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source and move provenance regression
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t18-six-native-kanto-renderers-browser.cjs
          node --check tests/t18-kanto-identity-pmd-151-built.test.mjs
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and compile authorized Phaser client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
          node tools/pokearena/build-preview.mjs
      - name: Check 151 Kanto stages and mirrored PMD PNGs
        run: |
          set -euo pipefail
          node --test tests/t18-kanto-identity-pmd-151-built.test.mjs
      - name: Render representative fighters in Chromium WebGL
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t18-six-native-kanto-renderers-browser.cjs
      - name: Full native Phaser browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t18-kanto-151-forms-evidence
          path: test-evidence/
          if-no-files-found: warn
