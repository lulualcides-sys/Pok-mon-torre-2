name: Master T05 — reset seguro sob falha de armazenamento
on:
  push:
    branches: [fix/t05-reset-backup-order-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t05-reset-atomicity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, full unit suite and preservation gates
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-campaign-core.js
          node --check tests/t05-campaign-backup-built.test.mjs
          node --check tests/t05-event-persistence-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and build original Phaser/WebGL client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Reset denial, save and backup unit regressions
        run: |
          set -euo pipefail
          node --test tests/t05-campaign-backup-built.test.mjs
          node --test tests/t05-duplicate-uid-repair-built.test.mjs
          node --test tests/t05-event-checkpoints-built.test.mjs
      - name: Chromium Phaser reset denial, reload and official browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t05-event-persistence-browser.cjs
          npm run test:browser
      - name: Evidence (including failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t05-reset-denial-evidence
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
