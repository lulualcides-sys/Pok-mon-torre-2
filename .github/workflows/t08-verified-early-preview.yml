name: T07/T08 — verified early Kanto level-up previews
on:
  push:
    branches: [fix/t07-t08-verified-early-legal-preview-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  early-verified:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, complete unit suite and four-source reuse policy
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-kanto-intro-moves.js
          node --check tests/kanto-intro-touch-browser.cjs
          node --check tests/t08-kanto-onboarding-151-built.test.mjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build versioned original Phaser/WebGL client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
               && node tools/pokearena/build-preview.mjs \
               && test -s _site/arena2d/version.json \
               && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Kanto 151 × 227, FRLG legality and actual Lv5–50 slots
        run: |
          set -euo pipefail
          node tools/pokearena/audit-moves.mjs
          node tests/t07-151-movesets-built.test.mjs
          node tests/t07-invalid-tm-save-151x227-built.test.mjs
          node tests/t07-gen45-kanto-built.test.mjs
          node tests/t08-kanto-onboarding-151-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
          node tests/t07-frlg-unrendered-136x639-built.test.mjs
          node tests/t08-arena-role-slots-built.test.mjs
          node tests/finale13-built.test.mjs
      - name: Real Phaser mobile touch and full Chromium regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/kanto-intro-touch-browser.cjs
          npm run test:browser
      - name: Preserve real browser and matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t08-verified-early-kanto-preview-evidence
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14
