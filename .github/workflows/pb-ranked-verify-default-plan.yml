name: PB Ranked — validar plano eficiente por movimentos padrão

on:
  push:
    branches: [research/pb-ranked-rea-20261031]
    paths:
      - '.github/workflows/pb-ranked-verify-default-plan.yml'
      - 'tools/research/pb-ranked-verify-default-plan.cjs'
      - 'reference-library/pb-ranked/PLANO-PADROES-PRIMEIRO-245-GOLPES.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-efficient-batch-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify syntax
        run: node --check tools/research/pb-ranked-verify-default-plan.cjs
      - name: Validate all 245 move names, default flags and source IDs
        run: node tools/research/pb-ranked-verify-default-plan.cjs
