name: Master T20 — 3 starters, Champion rosters and Hall boundaries
on:
  push:
    branches: [test/master-t20-champion-three-starters-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t20-champion-three-starters:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unitários e verificações de integridade
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t20-three-starter-champion-stage-built.test.mjs
          npm test
          npm run check
          npm run check:reuse
      - name: Capturar e compilar o Phaser original, sem alterar sprites
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json \
              && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Auditar os 3 Campeões com scripts reais compilados
        run: |
          set -euo pipefail
          node --test tests/t20-league-roster-built.test.mjs
          node --test tests/t20-three-starter-champion-stage-built.test.mjs
      - name: Regressões do cliente Phaser em Chromium
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - name: Salvar provas da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-t20-three-starter-champion
          path: test-evidence/t20-three-starter-champion-stage-boundary.json
          retention-days: 21
          if-no-files-found: warn
