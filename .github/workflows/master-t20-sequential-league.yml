name: Master T20 — consecutive native Lorelei and Bruno battles
on:
  push:
    branches: [test/master-t20-sequential-lorelei-bruno-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t20-sequential:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full unit suite, syntax, reuse and code checks
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t20-sequential-lorelei-bruno-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and build the original Phaser WebGL client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json \
              && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Play Lorelei then Bruno without intermediate fixtures
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t20-sequential-lorelei-bruno-browser.cjs
      - name: Official Phaser browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - name: Preserve evidence even when battle is lost
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t20-sequential-league-evidence
          path: test-evidence/
          if-no-files-found: warn
