name: T07 — battle report distinguishes earned native move from preview
on:
  push:
    branches: [fix/t07-battle-report-native-ult-unlock-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unlocked-moves:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test read-only battle results, native attack identity and all unit tests
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-battle-report.js
          node --check tests/battle-report.test.js
          node --test tests/battle-report.test.js
          npm run check
          npm run check:reuse
          npm test
      - name: Compile captured Phaser client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
               && node tools/pokearena/build-preview.mjs \
               && test -s _site/arena2d/version.json; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt*8))
          done
      - name: Battle, XP, level-up and native mobile regression
        run: |
          set -euo pipefail
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t08-summary-mobile-choice-browser.cjs
          npm run test:browser
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t07-battle-report-native-ult-evidence
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14
