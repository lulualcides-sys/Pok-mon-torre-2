# The historical Alpha 0.65.8 client-stage Actions artifact expired (3-day
# retention). Never pretend to have recovered that inaccessible archive.
# For current PR gating, use the audited, immutable Alpha 0.71.3 source and
# REA evidence from the successful homologation run. Fail closed on drift.
# Keep the legacy filename so existing required-check configurations persist.
name: Poké Arena — REA current native source and battle QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/pokearena/rea-capture-live-public.cjs'
      - '.github/workflows/pokearena-0658-rea-capture.yml'
      - 'tools/pokearena/rea-overlay-verified-client.mjs'
      - 'tools/pokearena/build-preview.mjs'
      - 'tools/pokearena/publish-hotfix-on-alpha0713.mjs'
      - 'tools/pokearena/torre2-arena-move-policy.js'
      - 'tools/pokearena/torre2-auto-battle.js'
      - 'tools/pokearena/torre2-wobbuffet-native.js'
      - 'tools/pokearena/torre2-johto-100-species.js'
      - 'tools/pokearena/torre2-pmd-pack-compat.mjs'
      - 'tests/rea-pmd-pack-compat.test.mjs'
      - 'tests/source-client-smoke.cjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rea-public-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture script syntax and provenance requirements
        run: |
          node --check tools/pokearena/rea-capture-live-public.cjs
          node --check tools/pokearena/rea-overlay-verified-client.mjs
          node --check tools/pokearena/publish-hotfix-on-alpha0713.mjs
      - name: Authenticate REA 0.71.3 source and audit artifacts by run, commit and digest
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GH_REPO/actions/runs/43657903565")
          echo "$release" | jq -e '.conclusion=="success" and .head_sha=="7c89fb0e900702d03c4a9954c6d49311330ad1f7"' >/dev/null
          artifacts=$(gh api "repos/$GH_REPO/actions/runs/43657903565/artifacts?per_page=100")
          echo "$artifacts" | jq -e 'any(.artifacts[]; .name=="pokearena-alpha070-homologated-site" and .expired==false and .digest=="sha256:130f60e5a9a5687d56f814fff7a92c55e3c960d48ecffe01362f7b4077507903")' >/dev/null
          echo "$artifacts" | jq -e 'any(.artifacts[]; .name=="current-rea-provenance-homolog-1" and .expired==false and .digest=="sha256:d9008396e9435093aabfb731e28714e58f372e257e2382d04764f927206c62ab")' >/dev/null
          echo "$artifacts" | jq -e 'any(.artifacts[]; .name=="current-rea-source-homolog-1" and .expired==false and .digest=="sha256:a5e4cca1be70819338ab408d0cdf1be5d08fec46435aafa0acaf2d5b7cf5867c")' >/dev/null
          mkdir -p site-capture/current-rea/provenance site-capture/current-rea/source
          gh run download 43657903565 --repo "$GH_REPO" \
            --name current-rea-provenance-homolog-1 --dir site-capture/current-rea/provenance
          gh run download 43657903565 --repo "$GH_REPO" \
            --name current-rea-source-homolog-1 --dir site-capture/current-rea/source
          test "$(find site-capture/current-rea/provenance -type f | wc -l)" -ge 1
          test "$(find site-capture/current-rea/source -type f | wc -l)" -ge 30
          echo "VERIFIED_CURRENT_REA_SOURCE_0713: audited run/commit/digests, source files and provenance present"
      - name: Preserve verified provenance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torre2-current-rea-provenance-qa
          path: site-capture/current-rea/provenance/
          if-no-files-found: warn
          retention-days: 14

  native-client-build:
    needs: rea-public-source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install declared tests and native-client dependencies
        run: npm install --no-audit --no-fund
      - name: Restore and confirm exact audited current Alpha 0.71.3 client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          gh run download 43657903565 --repo "$GH_REPO" \
            --name pokearena-alpha070-homologated-site --dir _site
          node --input-type=module <<'CHECK'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='_site/arena2d';
          const v=JSON.parse(fs.readFileSync(root+'/version.json','utf8'));
          if(v.src!=='src-5ccc174cb8'||!/^src-[a-f0-9]{10}$/.test(v.modules||''))
            throw Error('Audited current native client has changed');
          const conf=fs.readFileSync(path.join(root,v.modules,'config.js'),'utf8');
          if(!/\bVERSION\s*=\s*['"]0\.71\.3['"]/.test(conf))throw Error('Native Alpha 0.71.3 source absent');
          const audit=JSON.parse(fs.readFileSync(root+'/rights-audit-0713.json','utf8'));
          if(audit.alpha!=='0.71.3'||audit.src!==v.src||audit.summary?.forms!==30)
            throw Error('Audited native source or rights provenance absent');
          if(!fs.existsSync(root+'/CONTRIBUTOR-CREDITS-0713.md'))
            throw Error('Approved original credits missing');
          console.log('VERIFIED_NATIVE_SOURCE_0713',v.modules);
          CHECK
      - name: Build isolated current hotfix, retaining approved original client
        run: |
          set -euo pipefail
          node tools/pokearena/publish-hotfix-on-alpha0713.mjs
          node --input-type=module <<'CHECK'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='_site/arena2d';
          const v=JSON.parse(fs.readFileSync(root+'/version.json','utf8'));
          if(v.src!=='src-5ccc174cb8'||v.modules==='src-62269b459e')
            throw Error('No isolated updated source');
          const m=path.join(root,v.modules);
          const policy=fs.readFileSync(path.join(m,'torre2/arena-move-policy.js'),'utf8');
          const skills=fs.readFileSync(path.join(m,'habilidades.js'),'utf8');
          if(!policy.includes("'discharge':3")||!policy.includes("'psybeam':3.5")
             ||!skills.includes('...TORRE2_WOBBUFFET_FORMS'))
            throw Error('Requested native combat corrections missing');
          if(!fs.existsSync(root+'/src-62269b459e/habilidades.js'))
            throw Error('Rollback source missing');
          console.log('VERIFIED_CURRENT_NATIVE_HOTFIX',v.modules);
          CHECK
      - name: Unit tests, real Phaser mobile input and title navigation
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/arena-species-kit-policy.test.js tests/wobbuffet-gen45-native.test.js tests/forms-catalog-upstream.test.js tests/title-pokedex-fast-open.test.js tests/gen3-status.test.js tests/league-auto-battle.test.js
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/arena-johto-evolutions-browser.cjs
          node tests/arena-species-kit-browser.cjs
          node tests/alpha0713-hotfix-navigation-browser.cjs
      - name: Preserve browser failures without publishing invalid client
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: torre2-rea-current-native-failures
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14
