name: Master T28 — original audio settings and mobile persistence
on:
  push:
    branches: [feat/master-t28-persisted-audio-controls-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t28-native-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate original source, preferences and approved move policy
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t28-mobile-audio-settings-browser.cjs
          node --check tools/pokearena/torre2-audio-settings.js
          node --test tests/t28-audio-preferences.test.js
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and build original Phaser Kanto client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Real Chromium mobile audio menu and persistent global mute
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t28-mobile-audio-settings-browser.cjs
      - name: Official original Phaser browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t28-phaser-mobile-audio-settings
          path: test-evidence/
          if-no-files-found: warn
