name: Master T15 — sunlight Thunder native hit gate
on:
  push:
    branches: [fix/master-t15-sun-thunder-accuracy-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weather:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, unit, source and approved-move preservation
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-weather.js
          node --check tests/t15-native-thunder-weather-browser.cjs
          node --test tests/weather.test.js
          npm test
          npm run check
          npm run check:reuse
      - name: Build original authorized Phaser/WebGL client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*6))
          done
          node tools/pokearena/build-preview.mjs
      - name: Test real sunlight Thunder hit gate in Phaser
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t15-native-thunder-weather-browser.cjs
      - name: Official complete Phaser browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t15-native-thunder-sunlight-evidence
          path: test-evidence/
          if-no-files-found: warn
