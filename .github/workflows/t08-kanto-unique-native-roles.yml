name: T08 — 151 Kanto equipped moves unique across native roles
on:
  push:
    branches: [fix/t08-kanto-no-duplicate-native-slots-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-roles:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, native VFX policy and unit suite
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run check:reuse
          node --check tools/pokearena/torre2-move-pool.js
          node --check tests/t08-kanto-no-duplicate-native-built.test.mjs
          npm test
      - name: Compile captured Phaser client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Verify 151 x 227 legal catalogue and 9 progression levels
        run: |
          set -euo pipefail
          node tools/pokearena/audit-moves.mjs
          node tests/frlg-learnsets-built.test.mjs
          node tests/t07-151-movesets-built.test.mjs
          node tests/t07-invalid-tm-save-151x227-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/t08-kanto-ult-level-transition-built.test.mjs
          node tests/t08-ult-distinct-names-built.test.mjs
          node tests/t08-summary-real-moves-built.test.mjs
          node tests/t08-kanto-no-duplicate-native-built.test.mjs
      - name: Native mobile summary and full Chromium browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t08-summary-mobile-choice-browser.cjs
          node tests/kanto-intro-touch-browser.cjs
          npm run test:browser
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t08-kanto-unique-native-slots-evidence
          path: test-evidence/
          retention-days: 14
          if-no-files-found: warn
