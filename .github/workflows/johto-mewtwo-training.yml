name: Johto — Mewtwo Training laboratory (isolated)
on:
  pull_request:
    paths:
      - 'tools/pokearena/torre2-johto-*'
      - 'tools/pokearena/torre2-pixelfx-sheets.mjs'
      - 'package.json'
      - 'tools/pokearena/build-preview.mjs'
      - 'tests/johto-*'
      - '.github/workflows/johto-mewtwo-training.yml'
  workflow_dispatch:
permissions:
  contents: read
# Discard outdated CI from previous pushes to this PR, rather than queuing
# a full Mewtwo browser build for each tiny art adjustment.
concurrency:
  group: pt2-johto-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quick-pixel:
    name: Quick original-3 guard + PixelFX 43 mappings (no browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and targeted pixel assertions
        run: |
          node --check tools/pokearena/torre2-pixel-sheets.mjs
          node --check tools/pokearena/torre2-johto-lab-runtime.js
          node --check tools/pokearena/torre2-johto-lab-scene.js
          node --check tools/pokearena/torre2-pixelfx-sheets.mjs
          node --check tools/pokearena/torre2-johto-first-four-sheets.mjs
          node --test tests/johto-first-four.test.js
          node --check tools/pokearena/torre2-johto-pixelfx-runtime.js
          node --test tests/johto-pixelfx.test.js tests/johto-motion.test.js tests/johto-gen3-research.test.js tests/johto-gen3-mechanics.test.js tests/johto-signatures.test.js
          node --test tests/johto-pilot-sprites.test.mjs tests/johto-pixelart.test.js tests/johto-training-lab.test.js
  johto-training:
    needs: quick-pixel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax, lab invariants and existing JS unit regression
        run: |
          set -euo pipefail
          for file in tools/pokearena/torre2-johto-*.js tools/pokearena/build-preview.mjs; do node --check "$file"; done
          # Targeted tests already passed before this expensive browser job.
          # Full npm test remains in guard and pre-publication pipelines.
          node --test tests/johto-training-lab.test.js tests/johto-pixelart.test.js
          npm test
      - name: Capture upstream and build isolated Phaser preview
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep 4
          done
          node tools/pokearena/build-preview.mjs
          node tests/johto-training-lab-built.test.mjs
          node tests/johto-pixelfx-built.test.mjs
      - name: Test Mewtwo Lab with 3 approved, 15 replaced and 28 visual-only PixelFX casts
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/johto-training-lab-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: johto-mewtwo-training-evidence
          path: |
            test-evidence/
            _site/arena2d/version.json
            site-capture/CAPTURE-REPORT.json
          retention-days: 7
          if-no-files-found: warn
