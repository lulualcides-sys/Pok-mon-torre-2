name: T07 — restore approved native move baseline
on:
  push:
    branches: [fix/t07-restore-two-approved-native-moves-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, source integrity and approved reuse policy
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run check:reuse
          npm test
      - name: Capture original Phaser and compile
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt*8))
          done
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Restore legal FRLG abilities without new VFX
        run: |
          set -euo pipefail
          node tests/t07-approved-native-fallbacks-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
          node tests/t08-kanto-onboarding-151-built.test.mjs
          node tests/t07-approved-native-overlap-built.test.mjs
      - name: Native Phaser Chromium and regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/source-client-smoke.cjs
          npm run test:browser
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t07-approved-native-baseline-restoration
          path: test-evidence/
          retention-days: 14
          if-no-files-found: warn
