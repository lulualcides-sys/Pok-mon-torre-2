name: T08 — Struggle neutral contact only
on:
  push:
    branches: [fix/t08-neutral-struggle-vfx-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  neutral-struggle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, syntax and reuse policy
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test tests/kanto-intro-moves.test.js
          npm run check
          npm run check:reuse
          npm test
      - name: Build captured Phaser/WebGL client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Verify 151 Kanto kits and Chromium
        run: |
          set -euo pipefail
          node tests/t07-151-movesets-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
