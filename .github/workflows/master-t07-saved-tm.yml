name: Master T07 — saved TM compatibility
on:
  push:
    branches: [fix/t07-incompatible-saved-tm-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax, source tests and approved moves
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-move-pool.js
          node --check tests/frlg-learnsets-built.test.mjs
          npm test
          npm run check
          npm run check:reuse
      - name: Build the original Phaser client safely
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 6))
          done
          node tools/pokearena/build-preview.mjs
      - name: Verify 151 learnsets, saved TM guard and official gym rewards
        run: |
          set -euo pipefail
          node tests/frlg-learnsets-built.test.mjs
          node tests/campaign-awards-built.test.mjs
          node tests/misty-surge-built.test.mjs
      - name: Run full Phaser Chromium browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t07-saved-tm-compatibility-evidence
          path: test-evidence/
          if-no-files-found: warn
