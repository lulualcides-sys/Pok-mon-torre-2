name: T34 — Option C Route 1 isolated Phaser WebGL pixel-art proof
on:
  push:
    branches: [feat/t34-option-c-route1-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  art-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact preview-only Phaser dependency
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund phaser@3.90.0
      - name: Test new Route 1 map contract
        run: |
          set -euo pipefail
          node --test tests/option-c-route1.test.js tests/kanto-gallery.test.js
          node --check tools/pokearena/torre2-option-c-route1.js
          node --check tests/option-c-route1-native-browser.cjs
      - name: Render actual isolated Phaser/WebGL desktop and mobile
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/option-c-route1-native-browser.cjs
      - name: Upload native Phaser screenshot proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: option-c-route1-phaser-real-isolated
          path: test-evidence/option-c-route1/
          if-no-files-found: warn
          retention-days: 21
