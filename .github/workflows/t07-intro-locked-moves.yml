name: T07/T08 — prévias não liberam TM/HM ou VFX pendente
on:
  push:
    branches: [fix/t07-intro-unavailable-vfx-gate-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intro-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependências e testes completos
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-kanto-intro-moves.js
          node --check tools/pokearena/kanto-ultimate-policy.js
          npm test
          npm run check
          npm run check:reuse
      - name: Build do cliente Phaser/WebGL
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Cobertura 151 Kanto e níveis iniciais
        run: |
          set -euo pipefail
          node tests/t07-151-movesets-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/t08-kanto-ult-level-transition-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
      - name: Chromium real da campanha e regressões Phaser
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/kanto-intro-touch-browser.cjs
          npm run test:browser
      - name: Evidências, inclusive falhas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t07-intro-locked-moves-evidence
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
