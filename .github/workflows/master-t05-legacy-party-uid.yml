name: Master T05 — legacy party HP identity
on:
  push:
    branches: [fix/master-t05-legacy-party-hp-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-party:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, complete unit suite and preservation checks
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-party-battle.js
          node --check tests/t05-legacy-party-uid-built.test.mjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build original versioned Phaser/WebGL client
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Legacy party HP/status and save integrity in compiled Phaser
        run: |
          set -euo pipefail
          node --test tests/t05-legacy-party-uid-built.test.mjs
          node --test tests/section20-campaign-integrity-built.test.mjs
          node --test tests/t05-reject-invalid-save-built.test.mjs
      - name: Native Chromium Phaser/WebGL regression suite
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-t05-legacy-party-uid
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
