name: T03 — Fresh player journey, native Caterpie evolution
on:
  push:
    branches: [test/t03-fresh-ui-caterpie-earned-evolution-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  natural-caterpie:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source, save policies and approved attack reuse
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t03-caterpie-earned-evolution-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build genuine Phaser/WebGL client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
             && node tools/pokearena/build-preview.mjs \
             && test -s _site/arena2d/version.json \
             && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$n" = 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Validate fresh starter, evolved sprites and save compatibility
        run: |
          set -euo pipefail
          node tests/t01-starter-no-lab-mewtwo-built.test.mjs
          node tests/t03-evolved-pokedex-built.test.mjs
          node tests/t03-kanto-evolution-boundaries-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
      - name: Real touch starter, real catch, earned evolution and reload
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t03-caterpie-earned-evolution-browser.cjs
      - name: Native Phaser browser regression suite
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Save captures, battle logs and regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t03-fresh-starter-natural-caterpie-evidence
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14
