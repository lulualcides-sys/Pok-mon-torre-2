name: Master T24 — Kanto routes and mobile paging
on:
  push:
    branches: [test/master-t24-mobile-kanto-route-paging-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t24-kanto-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, baseline and approved move policy
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t24-kanto-13-mobile-route-paging-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and build actual Phaser/WebGL client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Open 13 real mobile Kanto routes and test paging/locked nodes
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t24-kanto-13-mobile-route-paging-browser.cjs
      - name: Complete original Phaser browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t24-kanto-mobile-route-pages
          path: test-evidence/
          if-no-files-found: warn
