name: Master T03 — Eevee três escolhas e save Phaser
on:
  push:
    branches: [feature/t03-eevee-choice-campaign-20261027]
  pull_request:
    paths:
      - 'tools/pokearena/torre2-campaign-core.js'
      - 'tests/t03-legacy-eevee-uid-built.test.mjs'
      - 'tests/t03-eevee-branch-choice-built.test.mjs'
      - '.github/workflows/master-t03-eevee-choices.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eevee-choice:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependências, sintaxe, política de golpes e testes unitários
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t03-eevee-choice-ui-browser.cjs
          node --check tests/t03-eevee-branch-choice-built.test.mjs
          node --check tests/t03-legacy-eevee-uid-built.test.mjs
          npm run check
          npm run check:reuse
          npm test
      - name: Restaurar release auditada com PMD completo e validar SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/pokearena/prepare-audited-qa.sh
      - name: Verificar nível, três formas, evolução em PC e save
        run: |
          node --test tests/t03-eevee-branch-choice-built.test.mjs tests/t03-legacy-eevee-uid-built.test.mjs
      - name: Testar escolhas de Eevee por toque no Chromium/Phaser
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t03-eevee-choice-ui-browser.cjs
      - name: Regressão WebGL e menus compatíveis com Alpha 0.71.3
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/alpha0713-hotfix-navigation-browser.cjs
          node tests/arena-johto-evolutions-browser.cjs
          node tests/arena-species-kit-browser.cjs
      - name: Preservar provas e imagens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-t03-eevee-choice-browser
          path: |
            test-evidence/t03-eevee-*
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
