name: Master T03 — Eevee três escolhas e save Phaser
on:
  push:
    branches: [feature/t03-eevee-choice-campaign-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eevee-choice:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependências, sintaxe, política de golpes e testes unitários
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t03-eevee-choice-ui-browser.cjs
          node --check tests/t03-eevee-branch-choice-built.test.mjs
          npm run check
          npm run check:reuse
          npm test
      - name: Captura e build Phaser/WebGL original
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Verificar nível, três formas, evolução em PC e save
        run: |
          node --test tests/t03-eevee-branch-choice-built.test.mjs
      - name: Testar escolhas de Eevee por toque no Chromium/Phaser
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t03-eevee-choice-ui-browser.cjs
      - name: Suite oficial completa de regressão WebGL e interface
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Preservar provas e imagens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-t03-eevee-choice-browser
          path: |
            test-evidence/t03-eevee-*
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
