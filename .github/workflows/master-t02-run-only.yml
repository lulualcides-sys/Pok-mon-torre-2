name: T02 — RUN selvagem + regressões existentes
on:
  push:
    branches: [fix/master-t02-run-only-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependencies + checks
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-capture-arena.js
          node --check tests/t02-desktop-run-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build original Phaser
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Native click RUN wild, cannot RUN trainer, BAG/party desktop + mobile
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t02-desktop-run-browser.cjs
          node tests/t02-mobile-menu-browser.cjs
          node tests/arena-preview-browser.cjs
      - name: Full official Phaser browser regressions
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t02-run-wild-focused-evidence
          path: |
            test-evidence/t02-*
            test-evidence/arena-six-*
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
