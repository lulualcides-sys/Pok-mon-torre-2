name: Pokémon Torre 2 — Captura do cliente Poké Arena (REA)
on:
  push:
    branches: [main]
    paths:
      - 'tools/pokearena/**'
      - 'tests/source-client-smoke.cjs'
      - 'tests/solo-kanto-built.test.mjs'
      - 'tests/evolution-modes-built.test.mjs'
      - 'data/kanto-new-phaser-moves.json'
      - 'tests/public-phaser-preview.cjs'
      - '.github/workflows/pokearena-source-snapshot.yml'
  schedule:
    # Daily fallback; the source branch may already have been captured today.
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokearena-source-snapshot
  cancel-in-progress: false

jobs:
  daily-gate:
    runs-on: ubuntu-24.04
    outputs:
      capture: ${{ steps.check.outputs.capture }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Avoid duplicate source downloads on the same Sao Paulo date
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'capture=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today="$(TZ=America/Sao_Paulo date +%F)"
          if git fetch --no-tags origin refs/heads/pokearena2d-cliente-phaser 2>/dev/null; then
            provenance="$(git show FETCH_HEAD:capture-provenance.json 2>/dev/null || true)"
            captured="$(printf '%s' "$provenance" | jq -r '.capturedAt // empty' 2>/dev/null || true)"
            if [ -n "$captured" ]; then
              captured_day="$(TZ=America/Sao_Paulo date -d "$captured" +%F 2>/dev/null || true)"
              if [ "$captured_day" = "$today" ]; then
                echo "Existing first-party capture on $today; skip redundant full download."
                echo 'capture=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          echo "No verified capture on $today; full source check required."
          echo 'capture=true' >> "$GITHUB_OUTPUT"
  capture:
    needs: daily-gate
    if: needs.daily-gate.outputs.capture == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Identificar fontes do site e recuperar arquivos publicamente servidos
        run: |
          set -euo pipefail
          node --check tools/pokearena/capture-client.mjs
          node tools/pokearena/capture-client.mjs
      - name: Montar cópia isolada para teste WebGL
        run: |
          npm install --no-audit --no-fund
          node --check tools/pokearena/build-preview.mjs
          node --check tests/source-client-smoke.cjs
          node tools/pokearena/build-preview.mjs
          # Refuse to replace the existing public clone with an incomplete
          # copy. Keep the failing asset names visible in the Actions log.
          node -e "const r=require('./site-capture/CAPTURE-REPORT.json'); const a=r.referencedAssets; if(!a){console.error('Dependency audit missing');process.exit(1)}; if(a.missing.length){console.error('Missing source-referenced game assets:',a.missing);process.exit(1)}"
          node tools/pokearena/audit-moves.mjs
          node tests/solo-kanto-built.test.mjs
          node tests/evolution-modes-built.test.mjs
      - name: Testar cliente original Phaser no Chromium
        run: |
          CHROME_BIN="$(command -v google-chrome)" node tests/source-client-smoke.cjs
      - name: Publicar ramo isolado de teste Phaser para GitHack (sem alterar Kanto)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/torre2-phaser-publicacao
          git worktree add --detach /tmp/torre2-phaser-publicacao HEAD
          cd /tmp/torre2-phaser-publicacao
          git switch --orphan pokearena2d-cliente-phaser
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$GITHUB_WORKSPACE/_site/arena2d/." .
          cat > SOURCE-CREDITS.md <<'EOF'
          # Poké Arena 2D — cópia técnica autorizada
          Origem: https://www.pokearena2d.com/
          Implementação original Phaser preservada conforme os arquivos públicos do site.
          A autorização de uso foi informada pelo criador do Pokémon Torre 2 para seu projeto
          pessoal, gratuito e sem comercialização. Todos os créditos originais de sprites e
          terceiros foram mantidos em assets/creditos.json e no menu de créditos.
          Este ramo é SOMENTE o cliente isolado para validação. A campanha Kanto continua
          sendo desenvolvida no ramo main do Pokémon Torre 2.
          EOF
          git config user.name "pokemon-torre-2-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "source: staged original Phaser client from pokearena2d.com (authorized personal copy)"
          git push origin HEAD:refs/heads/pokearena2d-cliente-phaser --force
          git rev-parse HEAD > "$GITHUB_WORKSPACE/arena-preview-commit.txt"
          echo '### Cliente Phaser original publicado em ramo isolado para teste' >> "$GITHUB_STEP_SUMMARY"
          echo 'https://raw.githack.com/lulualcides-sys/Pok-mon-torre-2/pokearena2d-cliente-phaser/index.html' >> "$GITHUB_STEP_SUMMARY"
      - name: Verificar endereço público do clone (não o Pages desativado)
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/public-phaser-preview.cjs
          ARENA_PUBLIC_URL="https://raw.githack.com/lulualcides-sys/Pok-mon-torre-2/$(cat arena-preview-commit.txt)/index.html" CHROME_BIN="$(command -v google-chrome)" node tests/public-phaser-preview.cjs
      - name: Validar segundo endereço CDN do GitHack no Android
        shell: bash
        run: |
          set -euo pipefail
          ARENA_PUBLIC_URL="https://rawcdn.githack.com/lulualcides-sys/Pok-mon-torre-2/$(cat arena-preview-commit.txt)/index.html" CHROME_BIN="$(command -v google-chrome)" node tests/public-phaser-preview.cjs
      - name: Arquivar capturas da verificação visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokearena2d-phaser-smoke-evidencias
          path: test-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Arquivar inventário exaustivo de golpes e suas ausências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokearena2d-inventario-golpes
          path: |
            site-capture/POKEARENA-MOVE-AUDIT.json
            site-capture/POKEARENA-MOVE-AUDIT.md
          retention-days: 30
          if-no-files-found: warn
      - name: Verificar a captura real e mostrar cobertura
        if: always()
        shell: bash
        run: |
          if test -f site-capture/CAPTURE-REPORT.json; then
            node -e "const j=require('./site-capture/CAPTURE-REPORT.json');console.log('capturados',j.totalFiles,'de',j.planned,'arquivos');console.log('falhas',j.unavailable?.length);console.log('versão encontrada',JSON.stringify(j.sourceVersions))"
          fi
      - name: Guardar fonte recuperada e relatório sem publicar em GitHub Pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokearena2d-cliente-publico-capturado
          path: site-capture/
          retention-days: 14
          if-no-files-found: error
