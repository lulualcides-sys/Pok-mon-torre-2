name: Arena — Psybeam Discharge Gengar native cooldown verification

on:
  push:
    branches:
      - fix/arena-psybeam-discharge-gengar-live-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arena-live-recasts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install tests
        run: npm install --no-audit --no-fund
      - name: Check source and isolated unit tests
        run: |
          set -euo pipefail
          node --check tools/pokearena/torre2-arena-move-policy.js
          node --check tests/arena-psybeam-discharge-gengar-live-browser.cjs
          node --test tests/arena-species-kit-policy.test.js
          npm run check
          npm test
      - name: Capture original Phaser and build edited game
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep 4
          done
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Test actual cooldown between native shots and Gengar moves
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/arena-species-kit-browser.cjs
          node tests/arena-psybeam-discharge-gengar-live-browser.cjs
          node tests/t09-native-cooldown-symmetry-browser.cjs
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-psybeam-discharge-gengar-live
          path: |
            test-evidence/
            site-capture/CAPTURE-REPORT.json
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 7
