name: Master T14 — native status switch and confusion lifecycle
on:
  push:
    branches: [test/master-t14-status-recall-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status-recall:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, syntax, source and sprite policy
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t14-native-status-recall-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Build authorized Phaser/WebGL game client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*6))
          done
          node tools/pokearena/build-preview.mjs
      - name: Verify burn and volatile confusion over two native mobile swaps
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t14-native-status-recall-browser.cjs
      - name: Official complete browser regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t14-native-status-recall
          path: test-evidence/
          if-no-files-found: warn
