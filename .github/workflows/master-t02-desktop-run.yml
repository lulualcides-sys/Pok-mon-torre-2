name: Master T02 — RUN selvagem + controles desktop
on:
  push:
    branches: [fix/master-t02-run-wild-desktop-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-wild:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies and check rules
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-capture-arena.js
          node --check tests/t02-desktop-run-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Capture native game and build
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Native browser desktop menu and RUN permissions
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t02-desktop-run-browser.cjs
          node tests/arena-preview-browser.cjs
          node tests/t02-battle-bag-desktop-regression.cjs
          node tests/t02-mobile-menu-browser.cjs
      - name: Global native Phaser regressions
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Preserve screens and run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-t02-run-desktop
          path: |
            test-evidence/t02-*
            test-evidence/arena-six-*
            test-evidence/battle-bag-*
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
