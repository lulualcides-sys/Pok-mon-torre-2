name: T10 — Kanto AUTO native foe-rebind and combat resilience
on:
  push:
    branches: [fix/t10-auto-native-stalls-20261030]
permissions:
  contents: read
jobs:
  auto-native-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source and focused AUTO regressions
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-auto-battle.js
          node --check tests/arena-auto-battle.test.js
          node --test tests/arena-auto-battle.test.js
      - name: Full Node and approved VFX policy gates
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run check:reuse
      - name: Build real approved Phaser/WebGL client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Native AUTO offensive and real party-switch Chromium
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t10-campaign-auto-offensive-browser.cjs
          node tests/t19-auto-party-rebind-browser.cjs
      - name: Full applicable browser regression suite
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Eight natural production campaign wins with AUTO
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t20-pallet-eight-production-starter-browser.cjs
      - name: Archive diagnostic evidence and Phaser build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t10-native-auto-resilience-original-webgl
          path: |
            test-evidence/
            _site/arena2d/version.json
          retention-days: 14
          if-no-files-found: warn
