name: Master T04 — native KO and party continuation
on:
  push:
    branches: [test/master-t04-natural-faint-party-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t04-natural-faint:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, core regression and provenance
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t04-natural-faint-party-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and build native Phaser client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
                && node tools/pokearena/build-preview.mjs \
                && test -s _site/arena2d/version.json; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Genuine CPU KO and party transition in Chromium WebGL
        run: |
          CHROME_BIN="$(command -v google-chrome)" node tests/t04-natural-faint-party-browser.cjs
      - name: Official browser regression
        run: |
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t04-natural-faint-evidence
          path: test-evidence/
          if-no-files-found: warn
