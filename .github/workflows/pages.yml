name: Pokémon Torre 2 — Publicação GitHub Pages

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_run:
    workflows: ["Pokémon Torre 2 — Testes de Combate e WebGL"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pokemon-torre-2-pages
  # When many move patches arrive, deploy only the latest commit.
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar apenas o jogo independente, sem scripts de teste
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css styles-v02.css joystick.css arena-lab-v08.css favicon.svg CREDITS_SPRITECOLLAB.md _site/
          cp -a src _site/src
          mkdir -p _site/docs
          cp docs/CREDITOS-E-LICENCAS.md docs/REA-IMPLEMENTACAO-INTEGRAL.md docs/CONTRATO_CAMPANHA.md _site/docs/
          test -s _site/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Adicionar cliente Phaser autorizado do Poké Arena como arena isolada
        shell: bash
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/index.html
          test -s _site/arena2d/lib/phaser.min.js
          # Keep the old Pixi test laboratory at /lab.html but launch the real
          # solo Kanto Phaser game at the stable public root once Pages is enabled.
          cp _site/index.html _site/lab.html
          cat > _site/index.html <<'EOF'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0;url=./arena2d/">
          <title>Pokémon Torre 2 — Kanto</title>
          <script>location.replace('./arena2d/'+location.search+location.hash)</script>
          </head><body style="background:#101725;color:#e2efff;font:18px system-ui;text-align:center;padding:30px">
          <p>Abrindo a campanha Pokémon Torre 2...</p>
          <a href="./arena2d/" style="color:#ffe16d">Abrir jogo</a>
          </body></html>
          EOF
      - name: Testar a arena Phaser original no Chromium antes de publicar
        shell: bash
        run: |
          npm install --no-audit --no-fund
          CHROME_BIN="$(command -v google-chrome)" node tests/source-client-smoke.cjs
      - name: Arquivar evidência visual do motor Phaser
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokearena2d-phaser-pagina-evidencias
          path: test-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Arquivar build pronto para publicar
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-torre-2-site-pronto
          path: _site/
          retention-days: 30
      - name: Detectar se GitHub Pages ja foi habilitado
        id: pages-enabled
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "/repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Site pronto, mas GitHub Pages precisa ser habilitado" >> "$GITHUB_STEP_SUMMARY"
            echo "Configuracao unica: Settings -> Pages -> Build and deployment -> Source: GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "Este workflow vai publicar automaticamente depois da configuracao." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.pages-enabled.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages-enabled.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - if: steps.pages-enabled.outputs.enabled == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
