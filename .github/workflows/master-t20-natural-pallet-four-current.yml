name: Master T20 — natural Pallet opening, four real Phaser fights
on:
  push:
    branches: [test/master-t20-natural-pallet-four-current-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t20-natural-pallet:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check tests and original gameplay code
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/section20-natural-four-trainers-browser.cjs
          npm test
          npm run check
          npm run check:reuse
      - name: Capture and build authentic Phaser client
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/version.json \
              && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
      - name: Pallet route, 4 genuine consecutive fights from Lv5 with original AUTO
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/section20-natural-four-trainers-browser.cjs
      - name: Save evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-t20-natural-pallet-four-current
          path: test-evidence/natural-*
          retention-days: 21
          if-no-files-found: warn
