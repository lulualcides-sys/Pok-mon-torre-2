name: Master T05 — economic checkpoint integrity
on:
  push:
    branches: [fix/master-t05-economy-checkpoint-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  economy-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full syntax, unit and reuse gates
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-campaign-core.js
          node --check tests/t05-economy-checkpoint-built.test.mjs
          node --check tests/t05-economy-checkpoint-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build original Phaser WebGL client
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Validate economic recovery and previous save regressions
        run: |
          set -euo pipefail
          node --test tests/t05-economy-checkpoint-built.test.mjs
          node --test tests/t05-reject-invalid-save-built.test.mjs
          node --test tests/t05-campaign-backup-built.test.mjs
          node --test tests/t05-duplicate-uid-repair-built.test.mjs
          node --test tests/t05-event-checkpoints-built.test.mjs
      - name: Real Chromium Phaser/WebGL and complete browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t05-economy-checkpoint-browser.cjs
          node tests/t05-browser-reload.cjs
          npm run test:browser
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-t05-economy-checkpoint
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
