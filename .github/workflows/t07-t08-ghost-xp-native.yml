name: T07/T08 — ghost signature slots and earned Ponyta XP in Phaser
on:
  push:
    branches: [fix/t07-t08-ghost-signature-xp-browser-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-progression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full unit, syntax and approved VFX provenance gates
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run check:reuse
          node --check tools/pokearena/torre2-move-pool.js
          node --check tests/t07-ghost-characteristic-slots-built.test.mjs
          node --check tests/t07-ponyta-earned-xp-editor-browser.cjs
          npm test
      - name: Capture existing native client and build Phaser/WebGL
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: T07/T08 compiled Kanto legal moves and signature regression
        run: |
          set -euo pipefail
          node tools/pokearena/audit-moves.mjs
          node tests/t07-151-movesets-built.test.mjs
          node tests/t07-frlg-natural-catalog-built.test.mjs
          node tests/t07-invalid-tm-save-151x227-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/t08-summary-real-moves-built.test.mjs
          node tests/t07-ghost-characteristic-slots-built.test.mjs
      - name: Actual Chromium native victory, XP, touch, save and battle
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t07-ponyta-earned-xp-editor-browser.cjs
          node tests/t08-summary-mobile-choice-browser.cjs
          node tests/t07-ponyta-signature-browser.cjs
          npm run test:browser
      - name: Preserve genuine screenshots and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t07-t08-ghost-pony-xp-evidence
          path: test-evidence/
          retention-days: 14
          if-no-files-found: warn
