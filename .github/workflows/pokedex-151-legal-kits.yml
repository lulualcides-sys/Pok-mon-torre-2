name: Pokédex — varredura integral 151 espécies e seis falhas reportadas
on:
  push:
    branches: [fix/pokedex-151-audit-legal-battle-loadouts-20261029]
  pull_request:
    paths:
      - 'tools/pokearena/torre2-pokedex-pages.mjs'
      - 'tests/pokedex-151-legal-kit-browser.cjs'
      - '.github/workflows/pokedex-151-legal-kits.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar sintaxe, regras de golpes, unidade e reuso
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-pokedex-pages.mjs
          node --check tests/pokedex-151-legal-kit-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Capturar e compilar cliente Phaser atual
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
                && node tools/pokearena/build-preview.mjs \
                && test -s _site/arena2d/version.json \
                && test -s _site/arena2d/lib/phaser.min.js; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Testar 151 kits, TMs, ULTs, evolução, nível 5 a 50
        run: |
          set -euo pipefail
          node tools/pokearena/audit-moves.mjs > /dev/null
          node tests/t07-151-movesets-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
          node tests/t08-arena-role-slots-built.test.mjs
          node tests/t03-evolved-pokedex-built.test.mjs
          node tests/misty-surge-built.test.mjs
      - name: Chromium — auditar 151 espécies e seis screenshots
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t18-pokedex-native-colors-browser.cjs
          node tests/pokedex-deoxys-native-browser.cjs
          node tests/pokedex-151-legal-kit-browser.cjs
      - name: Salvar relatório de auditoria e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokedex-151-audit-evidences
          path: test-evidence/
          retention-days: 21
          if-no-files-found: warn
