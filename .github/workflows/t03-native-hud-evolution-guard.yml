name: T03 — native HUD evolution guard audit
on:
  push:
    branches: [fix/t03-capture-hud-upstream-evo-audit-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-hud:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate original code and campaign
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm test
      - name: Capture and compile upstream Phaser
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          node tests/solo-kanto-built.test.mjs
          node tests/evolution-modes-built.test.mjs
          node tests/t08-151-signature-ult-built.test.mjs
      - name: Real browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
