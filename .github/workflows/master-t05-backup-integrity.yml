name: Master T05 — backup de save e migração idempotente
on:
  push:
    branches: [fix/master-t05-backup-integrity-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax, changes and existing unit suite
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-campaign-core.js
          node --check tests/t05-campaign-backup-built.test.mjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build original versioned Phaser game
        run: |
          set -euo pipefail
          node tools/pokearena/capture-client.mjs
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Preserve saves, back up corrupt JSON-valid payloads, avoid duplicate migration
        run: |
          set -euo pipefail
          node --test tests/t05-campaign-backup-built.test.mjs
          node --test tests/campaign-awards-built.test.mjs
          node --test tests/section20-repeatable-grass-built.test.mjs
      - name: Native Phaser browser regression for real saved campaign
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/section20-wild-recovery-browser.cjs
          node tests/battle-bag-browser.cjs
      - name: Retain native browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-t05-save-integrity
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
