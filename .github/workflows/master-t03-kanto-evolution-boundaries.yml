name: Master T03 — limites evolutivos Kanto e persistência
on:
  push:
    branches: [test/master-t03-kanto-evolution-boundaries-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kanto-evolution-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sintaxe, políticas e regressões unitárias existentes
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t03-kanto-evolution-boundaries-built.test.mjs
          npm run check
          npm run check:reuse
          npm test
      - name: Capturar e compilar o cliente Phaser real
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if node tools/pokearena/capture-client.mjs; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
          node tools/pokearena/build-preview.mjs
          test -s _site/arena2d/version.json
      - name: Checar todas as evoluções lineares por nível e salvar no motor construído
        run: |
          set -euo pipefail
          node --test tests/t03-kanto-evolution-boundaries-built.test.mjs
      - name: Regressões de controles, combates, Arena e campanha no Chromium
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Preservar artefatos do mapa evolutivo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-t03-kanto-level-boundaries
          path: |
            test-evidence/t03-kanto-evolution-boundaries.json
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
