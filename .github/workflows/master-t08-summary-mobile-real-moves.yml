name: T08 — mobile summary real moves and no click-through
on:
  push:
    branches: [fix/t08-real-summary-moves-mobile-pointer-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, approved VFX, syntax, full Kanto
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run check:reuse
          node --check tools/pokearena/torre2-move-pool.js
          node --check tools/pokearena/torre2-kanto-intro-moves.js
          node --check tools/pokearena/torre2-campaign-scene.js
          node --check tools/pokearena/torre2-pokedex-pages.mjs
          node --check tests/t08-summary-real-moves-built.test.mjs
          node --check tests/t08-summary-mobile-choice-browser.cjs
          npm test
      - name: Capture source, build actual Phaser WebGL client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs                 && node tools/pokearena/build-preview.mjs                 && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt*8))
          done
          node tools/pokearena/audit-moves.mjs
          node tests/kanto-151-built.test.mjs
          node tests/frlg-learnsets-built.test.mjs
          node tests/t07-151-movesets-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/t08-kanto-dex-live-levels-built.test.mjs
          node tests/t08-summary-real-moves-built.test.mjs
          node tests/t05-summary-equip-atomic-built.test.mjs
      - name: Native mobile touch and full Chromium regression
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)" node tests/t08-summary-mobile-choice-browser.cjs
          CHROME_BIN="$(command -v google-chrome)" node tests/t05-summary-equip-denied-ui-browser.cjs
          CHROME_BIN="$(command -v google-chrome)" node tests/kanto-intro-touch-browser.cjs
          CHROME_BIN="$(command -v google-chrome)" npm run test:browser
      - name: Keep screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t08-real-summary-mobile-evidence
          path: test-evidence/
          retention-days: 14
          if-no-files-found: warn
