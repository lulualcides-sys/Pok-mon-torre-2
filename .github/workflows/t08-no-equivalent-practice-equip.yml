name: T08 — native/practice move identity and Phaser regression
on:
  push:
    branches: [fix/t08-no-equivalent-practice-duplicates-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t08-no-duplicate-technique:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, syntax and four-source policy gates
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run check:reuse
          node --check tools/pokearena/torre2-move-pool.js
          node --check tests/t08-equivalent-practice-equip-built.test.mjs
          npm test
      - name: Capture original client and build Phaser/WebGL
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs &&
               node tools/pokearena/build-preview.mjs &&
               test -s _site/arena2d/version.json; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: T07/T08 real installed catalog and duplicate editor guard
        run: |
          set -euo pipefail
          node tests/t07-151-movesets-built.test.mjs
          node tests/t07-frlg-natural-catalog-built.test.mjs
          node tests/t07-invalid-tm-save-151x227-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/t08-equivalent-practice-equip-built.test.mjs
      - name: Chromium actual XP and mobile editor regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t07-ponyta-earned-xp-editor-browser.cjs
          node tests/t08-summary-mobile-choice-browser.cjs
          npm run test:browser
      - name: Preserve actual Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t08-no-duplicate-technique-evidence
          path: test-evidence/
          retention-days: 14
          if-no-files-found: warn
