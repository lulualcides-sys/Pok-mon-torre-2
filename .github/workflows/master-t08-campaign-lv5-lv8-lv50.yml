name: Master T08 — Kanto 151 campaign Lv5 moves, Lv8 ULT, Lv50 progression
on:
  push:
    branches: [fix/master-t08-all-kanto-campaign-moves-l5-l8-l50-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign-moves:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, approved effect policy and complete unit suite
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tools/pokearena/torre2-move-pool.js
          node --check tools/pokearena/torre2-kanto-intro-moves.js
          node --check tools/pokearena/torre2-pokedex-pages.mjs
          node --check tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          npm run check
          npm run check:reuse
          npm test
      - name: Capture and build original native Phaser WebGL campaign
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs; then break; fi
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*8))
          done
          test -s _site/arena2d/version.json
      - name: Check 150 species / Ponyta / real learnset / XP and ULT gates
        run: |
          set -euo pipefail
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/kanto-intro-loadout-built.test.mjs
          node tests/t08-kanto-ult-level-transition-built.test.mjs
          node tests/frlg-learnsets-built.test.mjs
          node tests/t05-event-checkpoints-built.test.mjs
      - name: Full real Phaser Chromium/WebGL and touch browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/kanto-intro-touch-browser.cjs
          npm run test:browser
      - name: Retain evidence and exact versioned modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t08-151-campaign-level5-to-50
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
