name: T07 — earned Lv8 ULT cast using native training meter
on:
  push:
    branches: [test/t07-earned-lv8-real-training-ult-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  earned-training-ult:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, policy, all unit tests
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/t07-earned-lv8-training-ult-browser.cjs
          node --check tests/t08-native-selection-pagination-browser.cjs
          npm run check
          npm run check:reuse
          npm test
      - name: Capture and compile native Phaser/WebGL client
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
               && node tools/pokearena/build-preview.mjs \
               && test -s _site/arena2d/version.json; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt*8))
          done
      - name: Verify 151 native move kits and exact level gates
        run: |
          set -euo pipefail
          node tests/t08-151-signature-ult-built.test.mjs
          node tests/t08-kanto-onboarding-151-built.test.mjs
          node tests/t08-kanto-ult-level-transition-built.test.mjs
          node tests/t08-summary-upcoming-151-built.test.mjs
          node tests/t08-ult-saved-versus-battle-built.test.mjs
      - name: Real three wins, natural XP and native training ULT
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/t08-native-selection-pagination-browser.cjs
          node tests/t07-earned-lv8-training-ult-browser.cjs
      - name: Native Phaser browser regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:browser
      - name: Keep evidence including failed screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t07-earned-lv8-native-training-ult
          path: |
            test-evidence/
            _site/arena2d/version.json
          if-no-files-found: warn
          retention-days: 14
