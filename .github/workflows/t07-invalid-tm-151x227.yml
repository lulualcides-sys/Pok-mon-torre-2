name: T07 — 151x227 invalid TM save compatibility
on:
  push:
    branches: [test/t07-151x227-invalid-tm-exclusion-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kanto-tm:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit, syntax, approved VFX provenance
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run check:reuse
          node --check tests/t07-invalid-tm-save-151x227-built.test.mjs
          npm test
      - name: Capture original and build Phaser/WebGL
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/pokearena/capture-client.mjs \
              && node tools/pokearena/build-preview.mjs \
              && test -s _site/arena2d/lib/phaser.min.js; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt*8))
          done
      - name: Legal move and forged TM audit of compiled client
        run: |
          set -euo pipefail
          node tools/pokearena/audit-moves.mjs
          node tests/t07-frlg-natural-catalog-built.test.mjs
          node tests/t07-151-movesets-built.test.mjs
          node tests/t07-gen45-kanto-built.test.mjs
          node tests/t08-kanto-151-moves-level5-to-50-built.test.mjs
          node tests/t08-kanto-dex-live-levels-built.test.mjs
          node tests/t07-invalid-tm-save-151x227-built.test.mjs
      - name: Native Chromium regression
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node tests/kanto-intro-touch-browser.cjs
          npm run test:browser
      - name: Preserve exclusion matrix and browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t07-kanto-invalid-tm-exclusion-matrix
          path: test-evidence/
          retention-days: 14
          if-no-files-found: warn
