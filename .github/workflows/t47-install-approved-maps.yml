name: T47 — instalar 60 artes e validar Phaser real
on:
  push:
    branches: [feat/t47-phaser-approved-map-default-20261102]
    paths:
      - 'assets/import/atlas-60-mapas-phaser.zip'
permissions:
  contents: write
concurrency:
  group: t47-approved-install-${{ github.ref }}
  cancel-in-progress: false
jobs:
  install-and-test:
    name: ZIP aprovado → mapas Phaser + QA mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check archive against pinned SHA-256 and approved atlas
        run: |
          set -euo pipefail
          test -f assets/import/atlas-60-mapas-phaser.zip
          python3 tools/pokearena/install-approved-maps.py assets/import/atlas-60-mapas-phaser.zip --check-only
      - name: Install the 60 exact WebP backgrounds and enable Phaser
        run: |
          set -euo pipefail
          python3 tools/pokearena/install-approved-maps.py assets/import/atlas-60-mapas-phaser.zip
          test "$(find assets/ui/kanto-approved-maps -type f -name '*.webp' | wc -l)" -eq 60
          grep -q 'APPROVED_MAP_ASSETS_READY = true' tools/pokearena/torre2-approved-map-renderer.js
      - name: Test JavaScript syntax, navigation, AABB and existing combat code
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check tests/approved-map-browser.cjs
          node --check tests/visual-guard-browser.cjs
          node --test tests/approved-map-first-scenes.test.mjs tests/approved-map-renderer.test.mjs tests/approved-maps-atlas.test.mjs tests/approved-map-build-integration.test.mjs
          npm run check
          npm run check:reuse
          npm test
      - name: Build original Phaser client with installed images
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node tools/pokearena/capture-client.mjs && node tools/pokearena/build-preview.mjs; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt*8))
          done
          test -s _site/arena2d/lib/phaser.min.js
          test -s _site/arena2d/assets/ui/kanto-approved-maps/kanto/pewter-city.webp
          test -s _site/arena2d/assets/ui/kanto-approved-maps/kanto/ss-anne.webp
      - name: Prove native WebP city/gym loading, mouse and Android-sized touch
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/approved-map-browser.cjs
      - name: Run full visual guard without breaking battle/sprites
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/visual-guard-browser.cjs
      - name: Upload evidence of browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t47-phaser-approved-maps-evidence
          path: |
            test-evidence/approved-maps/
            test-evidence/visual-guard/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit validated WebP assets into DRAFT branch only
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f assets/import/atlas-60-mapas-phaser.zip
          git add assets/ui/kanto-approved-maps/ tools/pokearena/torre2-approved-map-renderer.js
          test "$(git diff --cached --name-only | grep -c '\.webp$')" -eq 60
          git commit -m "assets(T47): install 60 verified original WebP scenes into Phaser"
          git push origin HEAD:feat/t47-phaser-approved-map-default-20261102
